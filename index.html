    <script>(function staticShellBoot(builderPathPrefix) {
	const shell = document.getElementById("composition-shell");
	if (!shell) return;
	try {
		if (location.pathname.indexOf(builderPathPrefix) !== 0) {
			shell.remove();
			return;
		}
		let state = {};
		try {
			const raw = localStorage.getItem("composition-ui");
			const parsed = raw ? JSON.parse(raw) : null;
			if (parsed && typeof parsed.state === "object" && parsed.state) state = parsed.state;
		} catch {
			state = {};
		}
		const mode = state.themeMode;
		const dark = mode === "dark" || mode !== "light" && typeof matchMedia === "function" && matchMedia("(prefers-color-scheme: dark)").matches;
		const html = document.documentElement;
		html.setAttribute("data-builder-theme", dark ? "dark" : "light");
		const scale = typeof state.uiScale === "number" && state.uiScale > 0 ? state.uiScale : null;
		if (scale !== null) html.style.setProperty("--ui-scale", String(scale));
		shell.hidden = false;
	} catch {
		shell.remove();
	}
})("/composition/builder/");</script>
