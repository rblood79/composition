name: Deploy

on:
  push:
    branches:
      - main

# GitHub Pages 배포를 위한 권한 설정
permissions:
  contents: write # gh-pages 브랜치에 푸시하기 위해 필요

# 동시 배포 방지
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # package.json의 "packageManager" 필드에서 pnpm 버전 자동 감지

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      # Rust WASM 빌드 (Taffy 레이아웃 엔진)
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/engine/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('packages/engine/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      # 스크립트 이름은 `wasm:build:engine` 이다. 구 `wasm:build`(Taffy)는
      # 022f43c5a(2026-07-06, ADR-916)에서 제거됐는데 이 단계가 따라오지 못해
      # 그때부터 배포가 계속 실패했다 — 캐시 경로/키도 같은 커밋에서 사라진
      # `canvas/wasm/` 을 가리키고 있었다.
      - name: Build Rust WASM (engine)
        run: pnpm wasm:build:engine

      - name: Verify lockfile sync and install dependencies
        run: |
          echo "Verifying pnpm-lock.yaml is in sync with package.json..."
          if ! pnpm install --frozen-lockfile 2>&1 | tee /tmp/install.log; then
            echo "::error::pnpm-lock.yaml is out of sync with package.json"
            echo "::error::Run 'pnpm install' locally, commit the updated pnpm-lock.yaml, and push."
            cat /tmp/install.log
            exit 1
          fi

      - name: Cache turbo build
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Build project
        run: pnpm turbo run build --filter=@composition/builder
        env:
          VITE_USE_WEBGL_CANVAS: "true"
          VITE_FEATURE_FILL_V2: "true"
          # VITE_CANVAS_COMPARE_MODE: 프로덕션에서는 기본값 false 사용 (디버그 전용)

      # ADR-300 G4 (a) — ADR-201 initial 번들 절대 상한 (재승인 절의 현재 값). 넘은 main 은 배포하지
      # 않는다. Δ (before/after) 는 실행자가 push 전에 `adr201-bundle-gate.mjs` 로 잰다 (before 빌드가
      # 필요해 여기서 돌리지 않는다).
      - name: Initial bundle ceiling (ADR-201)
        env:
          BUILDER_CEILING: "1410000"
          PREVIEW_CEILING: "325000"
        run: |
          node apps/builder/scripts/adr209-bundle-closure.mjs --repo . --dist apps/builder/dist --entry index.html --label builder --out /tmp/bundle-builder.json
          node apps/builder/scripts/adr209-bundle-closure.mjs --repo . --dist apps/builder/dist --entry preview.html --label preview --out /tmp/bundle-preview.json
          node -e '
            const read = (f) => JSON.parse(require("fs").readFileSync(f, "utf8")).initial.js.gzipBytes;
            const rows = [
              ["builder", read("/tmp/bundle-builder.json"), Number(process.env.BUILDER_CEILING)],
              ["preview", read("/tmp/bundle-preview.json"), Number(process.env.PREVIEW_CEILING)],
            ];
            let over = false;
            for (const [label, bytes, ceiling] of rows) {
              console.log(`${label}: initial JS gzip ${bytes} / ceiling ${ceiling}`);
              if (!(bytes <= ceiling)) {
                over = true;
                console.log(`::error::${label} initial bundle ${bytes} B > ${ceiling} B (ADR-201)`);
              }
            }
            process.exit(over ? 1 : 0);
          '

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apps/builder/dist
          publish_branch: gh-pages
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
