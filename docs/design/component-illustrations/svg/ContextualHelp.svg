<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="ContextualHelp-title ContextualHelp-desc">
  <title id="ContextualHelp-title">ContextualHelp</title>
  <desc id="ContextualHelp-desc">투명 배경의 편집 가능한 무채색 ContextualHelp 컴포넌트 일러스트</desc>
  <defs>
    <linearGradient id="ContextualHelp-surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4f4f4" />
      <stop offset="1" stop-color="#dedede" />
    </linearGradient>
    <linearGradient id="ContextualHelp-ink" x1="0" y1="0" x2="0" y2="1">
