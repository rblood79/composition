<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="TimeField-title TimeField-desc">
  <title id="TimeField-title">TimeField</title>
  <desc id="TimeField-desc">투명 배경의 편집 가능한 무채색 TimeField 컴포넌트 일러스트</desc>
  <defs>
    <linearGradient id="TimeField-surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4f4f4" />
      <stop offset="1" stop-color="#dedede" />
    </linearGradient>
    <linearGradient id="TimeField-ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#777777" />
      <stop offset="1" stop-color="#4c4c4c" />
    </linearGradient>
    <linearGradient id="TimeField-wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e1e1e1" />
      <stop offset="1" stop-color="#b5b5b5" />
    </linearGradient>
    <linearGradient id="TimeField-area" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#eeeeee" />
      <stop offset="1" stop-color="#555555" />
    </linearGradient>
    <linearGradient id="TimeField-shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#303030" stop-opacity="0" />
      <stop offset="1" stop-color="#303030" stop-opacity=".8" />
    </linearGradient>
    <filter id="TimeField-shadow" x="0" y="0" width="300" height="300" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity=".16" />
    </filter>
  </defs>
  <g id="TimeField-illustration">
    <rect x="51" y="97" width="72" height="8" rx="4.0" fill="#767676" />
    <rect x="35" y="122" width="230" height="60" rx="12" fill="url(#TimeField-surface)" stroke="#a1a1a1" stroke-width="1.5" filter="url(#TimeField-shadow)" />
    <rect x="53.0" y="148" width="30" height="8" rx="4.0" fill="#505050" />
    <rect x="135.0" y="148" width="30" height="8" rx="4.0" fill="#505050" />
    <rect x="217.0" y="148" width="30" height="8" rx="4.0" fill="#505050" />
    <circle cx="109" cy="148" r="2" fill="#858585" />
    <circle cx="109" cy="156" r="2" fill="#858585" />
    <circle cx="191" cy="148" r="2" fill="#858585" />
    <circle cx="191" cy="156" r="2" fill="#858585" />
    <rect x="51" y="202" width="115" height="6" rx="3.0" fill="#b9b9b9" />
  </g>
</svg>
