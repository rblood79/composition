<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="ActionBar-title ActionBar-desc">
  <title id="ActionBar-title">ActionBar</title>
  <desc id="ActionBar-desc">투명 배경의 편집 가능한 무채색 ActionBar 컴포넌트 일러스트</desc>
  <defs>
    <linearGradient id="ActionBar-surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4f4f4" />
      <stop offset="1" stop-color="#dedede" />
    </linearGradient>
    <linearGradient id="ActionBar-ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#777777" />
      <stop offset="1" stop-color="#4c4c4c" />
    </linearGradient>
    <linearGradient id="ActionBar-wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e1e1e1" />
      <stop offset="1" stop-color="#b5b5b5" />
    </linearGradient>
    <linearGradient id="ActionBar-area" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#eeeeee" />
      <stop offset="1" stop-color="#555555" />
    </linearGradient>
    <linearGradient id="ActionBar-shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#303030" stop-opacity="0" />
      <stop offset="1" stop-color="#303030" stop-opacity=".8" />
    </linearGradient>
    <filter id="ActionBar-shadow" x="0" y="0" width="300" height="300" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity=".16" />
    </filter>
  </defs>
  <g id="ActionBar-illustration">
    <rect x="27" y="111" width="246" height="78" rx="18" fill="url(#ActionBar-surface)" stroke="#a1a1a1" stroke-width="1.5" filter="url(#ActionBar-shadow)" />
    <rect x="43" y="140" width="20" height="20" rx="5" fill="#505050" stroke="#505050" stroke-width="1.5" />
    <g transform="translate(53 150) scale(0.7)">
      <path d="M-7 0L-2 5L8 -6" fill="none" stroke="#eeeeee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <rect x="74" y="147" width="45" height="6" rx="3.0" fill="#505050" />
    <path d="M133 129L133 171" fill="none" stroke="#b9b9b9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="146" y="130" width="41" height="40" rx="10" fill="url(#ActionBar-surface)" stroke="#b9b9b9" stroke-width="1.5" />
    <g transform="translate(167 150) scale(1)">
      <path d="M-6 0H6M0 -6V6" fill="none" stroke="#505050" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <rect x="195" y="130" width="60" height="40" rx="10" fill="url(#ActionBar-ink)" stroke="#505050" stroke-width="1.5" />
    <rect x="210.0" y="147.0" width="30.0" height="6" rx="3.0" fill="#e9e9e9" />
    <rect x="43" y="91" width="89" height="6" rx="3.0" fill="#b9b9b9" />
  </g>
</svg>
