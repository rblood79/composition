<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="ColorField-title ColorField-desc">
  <title id="ColorField-title">ColorField</title>
  <desc id="ColorField-desc">투명 배경의 편집 가능한 무채색 ColorField 컴포넌트 일러스트</desc>
  <defs>
    <linearGradient id="ColorField-surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4f4f4" />
      <stop offset="1" stop-color="#dedede" />
    </linearGradient>
    <linearGradient id="ColorField-ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#777777" />
      <stop offset="1" stop-color="#4c4c4c" />
    </linearGradient>
    <linearGradient id="ColorField-wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e1e1e1" />
      <stop offset="1" stop-color="#b5b5b5" />
    </linearGradient>
    <linearGradient id="ColorField-area" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#eeeeee" />
      <stop offset="1" stop-color="#555555" />
    </linearGradient>
    <linearGradient id="ColorField-shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#303030" stop-opacity="0" />
      <stop offset="1" stop-color="#303030" stop-opacity=".8" />
    </linearGradient>
    <filter id="ColorField-shadow" x="0" y="0" width="300" height="300" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity=".16" />
    </filter>
  </defs>
  <g id="ColorField-illustration">
    <rect x="52" y="94" width="69" height="8" rx="4.0" fill="#767676" />
    <rect x="38" y="120" width="224" height="58" rx="12" fill="url(#ColorField-surface)" stroke="#a1a1a1" stroke-width="1.5" filter="url(#ColorField-shadow)" />
    <rect x="52" y="133" width="31" height="31" rx="7" fill="url(#ColorField-ink)" stroke="#b9b9b9" stroke-width="1.5" />
    <rect x="97" y="145" width="112" height="8" rx="4.0" fill="#505050" />
  </g>
</svg>
