<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="Switch-title Switch-desc">
  <title id="Switch-title">Switch</title>
  <desc id="Switch-desc">투명 배경의 편집 가능한 무채색 Switch 컴포넌트 일러스트</desc>
  <defs>
    <linearGradient id="Switch-surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4f4f4" />
      <stop offset="1" stop-color="#dedede" />
    </linearGradient>
    <linearGradient id="Switch-ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#777777" />
      <stop offset="1" stop-color="#4c4c4c" />
    </linearGradient>
    <linearGradient id="Switch-wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e1e1e1" />
      <stop offset="1" stop-color="#b5b5b5" />
    </linearGradient>
    <linearGradient id="Switch-area" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#eeeeee" />
      <stop offset="1" stop-color="#555555" />
    </linearGradient>
    <linearGradient id="Switch-shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#303030" stop-opacity="0" />
      <stop offset="1" stop-color="#303030" stop-opacity=".8" />
    </linearGradient>
    <filter id="Switch-shadow" x="0" y="0" width="300" height="300" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity=".16" />
    </filter>
  </defs>
  <g id="Switch-illustration">
    <rect x="39" y="81" width="222" height="138" rx="18" fill="url(#Switch-surface)" stroke="#a1a1a1" stroke-width="1.5" filter="url(#Switch-shadow)" />
    <rect x="57" y="104" width="64" height="34" rx="17" fill="url(#Switch-ink)" stroke="#b9b9b9" stroke-width="1.5" />
    <circle cx="103" cy="121" r="12" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1" />
    <rect x="139" y="117" width="99" height="8" rx="4.0" fill="#505050" />
    <rect x="57" y="160" width="64" height="34" rx="17" fill="#dedede" stroke="#b9b9b9" stroke-width="1.5" />
    <circle cx="75" cy="177" r="12" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1" />
    <rect x="139" y="173" width="76" height="8" rx="4.0" fill="#b9b9b9" />
  </g>
</svg>
