<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="ColorArea-title ColorArea-desc">
  <title id="ColorArea-title">ColorArea</title>
  <desc id="ColorArea-desc">투명 배경의 편집 가능한 무채색 ColorArea 컴포넌트 일러스트</desc>
  <defs>
    <linearGradient id="ColorArea-surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4f4f4" />
      <stop offset="1" stop-color="#dedede" />
    </linearGradient>
    <linearGradient id="ColorArea-ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#777777" />
      <stop offset="1" stop-color="#4c4c4c" />
    </linearGradient>
    <linearGradient id="ColorArea-wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e1e1e1" />
      <stop offset="1" stop-color="#b5b5b5" />
    </linearGradient>
    <linearGradient id="ColorArea-area" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#eeeeee" />
      <stop offset="1" stop-color="#555555" />
    </linearGradient>
    <linearGradient id="ColorArea-shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#303030" stop-opacity="0" />
      <stop offset="1" stop-color="#303030" stop-opacity=".8" />
    </linearGradient>
    <filter id="ColorArea-shadow" x="0" y="0" width="300" height="300" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity=".16" />
    </filter>
  </defs>
  <g id="ColorArea-illustration">
    <rect x="49" y="49" width="202" height="202" rx="18" fill="url(#ColorArea-surface)" stroke="#a1a1a1" stroke-width="1.5" filter="url(#ColorArea-shadow)" />
    <rect x="63" y="63" width="174" height="174" rx="12" fill="url(#ColorArea-area)" />
    <rect x="63" y="63" width="174" height="174" rx="12" fill="url(#ColorArea-shade)" />
    <circle cx="188" cy="112" r="10" fill="none" stroke="#eeeeee" stroke-width="4" />
    <circle cx="188" cy="112" r="12" fill="none" stroke="#505050" stroke-width="1.5" />
  </g>
</svg>
