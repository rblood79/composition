<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="chart-radar-title chart-radar-desc">
  <title id="chart-radar-title">chart-radar</title>
  <desc id="chart-radar-desc">투명 배경의 편집 가능한 무채색 chart-radar 컴포넌트 일러스트</desc>
  <defs>
    <linearGradient id="chart-radar-surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4f4f4" />
      <stop offset="1" stop-color="#dedede" />
    </linearGradient>
    <linearGradient id="chart-radar-ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#777777" />
      <stop offset="1" stop-color="#4c4c4c" />
    </linearGradient>
    <linearGradient id="chart-radar-wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e1e1e1" />
