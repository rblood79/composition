<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="Meter-title Meter-desc">
  <title id="Meter-title">Meter</title>
  <desc id="Meter-desc">투명 배경의 편집 가능한 무채색 Meter 컴포넌트 일러스트</desc>
  <defs>
    <linearGradient id="Meter-surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4f4f4" />
      <stop offset="1" stop-color="#dedede" />
    </linearGradient>
    <linearGradient id="Meter-ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#777777" />
      <stop offset="1" stop-color="#4c4c4c" />
    </linearGradient>
    <linearGradient id="Meter-wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e1e1e1" />
      <stop offset="1" stop-color="#b5b5b5" />
    </linearGradient>
    <linearGradient id="Meter-area" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#eeeeee" />
      <stop offset="1" stop-color="#555555" />
    </linearGradient>
    <linearGradient id="Meter-shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#303030" stop-opacity="0" />
      <stop offset="1" stop-color="#303030" stop-opacity=".8" />
    </linearGradient>
    <filter id="Meter-shadow" x="0" y="0" width="300" height="300" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity=".16" />
    </filter>
  </defs>
  <g id="Meter-illustration">
    <rect x="32" y="94" width="236" height="112" rx="18" fill="url(#Meter-surface)" stroke="#a1a1a1" stroke-width="1.5" filter="url(#Meter-shadow)" />
    <rect x="54" y="115" width="74" height="7" rx="3.5" fill="#505050" />
    <rect x="213" y="115" width="32" height="7" rx="3.5" fill="#858585" />
    <rect x="54" y="147" width="12" height="20" rx="3" fill="#505050" />
    <rect x="70" y="147" width="12" height="20" rx="3" fill="#505050" />
    <rect x="86" y="147" width="12" height="20" rx="3" fill="#505050" />
    <rect x="102" y="147" width="12" height="20" rx="3" fill="#505050" />
    <rect x="118" y="147" width="12" height="20" rx="3" fill="#505050" />
    <rect x="134" y="147" width="12" height="20" rx="3" fill="#505050" />
    <rect x="150" y="147" width="12" height="20" rx="3" fill="#505050" />
    <rect x="166" y="147" width="12" height="20" rx="3" fill="#505050" />
    <rect x="182" y="147" width="12" height="20" rx="3" fill="#dedede" />
    <rect x="198" y="147" width="12" height="20" rx="3" fill="#dedede" />
    <rect x="214" y="147" width="12" height="20" rx="3" fill="#dedede" />
    <rect x="230" y="147" width="12" height="20" rx="3" fill="#dedede" />
