<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="RangeSlider-title RangeSlider-desc">
  <title id="RangeSlider-title">RangeSlider</title>
  <desc id="RangeSlider-desc">투명 배경의 편집 가능한 무채색 RangeSlider 컴포넌트 일러스트</desc>
  <defs>
    <linearGradient id="RangeSlider-surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4f4f4" />
      <stop offset="1" stop-color="#dedede" />
    </linearGradient>
    <linearGradient id="RangeSlider-ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#777777" />
      <stop offset="1" stop-color="#4c4c4c" />
    </linearGradient>
    <linearGradient id="RangeSlider-wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e1e1e1" />
      <stop offset="1" stop-color="#b5b5b5" />
    </linearGradient>
    <linearGradient id="RangeSlider-area" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#eeeeee" />
      <stop offset="1" stop-color="#555555" />
    </linearGradient>
    <linearGradient id="RangeSlider-shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#303030" stop-opacity="0" />
      <stop offset="1" stop-color="#303030" stop-opacity=".8" />
    </linearGradient>
    <filter id="RangeSlider-shadow" x="0" y="0" width="300" height="300" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity=".16" />
    </filter>
  </defs>
  <g id="RangeSlider-illustration">
    <rect x="31" y="99" width="238" height="102" rx="18" fill="url(#RangeSlider-surface)" stroke="#a1a1a1" stroke-width="1.5" filter="url(#RangeSlider-shadow)" />
    <rect x="52" y="119" width="73" height="7" rx="3.5" fill="#505050" />
    <rect x="217" y="119" width="27" height="7" rx="3.5" fill="#858585" />
    <rect x="52" y="153" width="196" height="9" rx="4.5" fill="#dedede" />
    <rect x="96" y="153" width="106" height="9" rx="4.5" fill="#505050" />
    <circle cx="96" cy="157.5" r="12" fill="#eeeeee" stroke="#505050" stroke-width="3" />
    <circle cx="202" cy="157.5" r="12" fill="#eeeeee" stroke="#505050" stroke-width="3" />
  </g>
</svg>
