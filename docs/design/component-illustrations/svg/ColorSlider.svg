<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="ColorSlider-title ColorSlider-desc">
  <title id="ColorSlider-title">ColorSlider</title>
  <desc id="ColorSlider-desc">투명 배경의 편집 가능한 무채색 ColorSlider 컴포넌트 일러스트</desc>
  <defs>
    <linearGradient id="ColorSlider-surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4f4f4" />
      <stop offset="1" stop-color="#dedede" />
    </linearGradient>
    <linearGradient id="ColorSlider-ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#777777" />
      <stop offset="1" stop-color="#4c4c4c" />
    </linearGradient>
    <linearGradient id="ColorSlider-wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e1e1e1" />
      <stop offset="1" stop-color="#b5b5b5" />
    </linearGradient>
    <linearGradient id="ColorSlider-area" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#eeeeee" />
      <stop offset="1" stop-color="#555555" />
    </linearGradient>
    <linearGradient id="ColorSlider-shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#303030" stop-opacity="0" />
      <stop offset="1" stop-color="#303030" stop-opacity=".8" />
    </linearGradient>
    <filter id="ColorSlider-shadow" x="0" y="0" width="300" height="300" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity=".16" />
    </filter>
  </defs>
  <g id="ColorSlider-illustration">
    <rect x="31" y="99" width="238" height="102" rx="18" fill="url(#ColorSlider-surface)" stroke="#a1a1a1" stroke-width="1.5" filter="url(#ColorSlider-shadow)" />
    <rect x="52" y="119" width="73" height="7" rx="3.5" fill="#505050" />
    <rect x="217" y="119" width="27" height="7" rx="3.5" fill="#858585" />
    <rect x="52" y="151" width="196" height="15" rx="7.5" fill="url(#ColorSlider-area)" />
    <circle cx="172" cy="158.5" r="12" fill="#eeeeee" stroke="#505050" stroke-width="3" />
  </g>
</svg>
