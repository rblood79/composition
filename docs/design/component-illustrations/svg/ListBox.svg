<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="ListBox-title ListBox-desc">
  <title id="ListBox-title">ListBox</title>
  <desc id="ListBox-desc">투명 배경의 편집 가능한 무채색 ListBox 컴포넌트 일러스트</desc>
  <defs>
    <linearGradient id="ListBox-surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4f4f4" />
      <stop offset="1" stop-color="#dedede" />
    </linearGradient>
    <linearGradient id="ListBox-ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#777777" />
      <stop offset="1" stop-color="#4c4c4c" />
    </linearGradient>
    <linearGradient id="ListBox-wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e1e1e1" />
      <stop offset="1" stop-color="#b5b5b5" />
    </linearGradient>
    <linearGradient id="ListBox-area" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#eeeeee" />
      <stop offset="1" stop-color="#555555" />
    </linearGradient>
    <linearGradient id="ListBox-shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#303030" stop-opacity="0" />
      <stop offset="1" stop-color="#303030" stop-opacity=".8" />
    </linearGradient>
    <filter id="ListBox-shadow" x="0" y="0" width="300" height="300" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity=".16" />
    </filter>
  </defs>
  <g id="ListBox-illustration">
    <rect x="57" y="45" width="186" height="210" rx="16" fill="url(#ListBox-surface)" stroke="#a1a1a1" stroke-width="1.5" filter="url(#ListBox-shadow)" />
    <rect x="80" y="75" width="14" height="14" rx="4" fill="#858585" />
    <rect x="106" y="78" width="80" height="7" rx="3.5" fill="#858585" />
    <rect x="68" y="109" width="164" height="36" rx="8" fill="#dedede" />
    <rect x="80" y="119" width="14" height="14" rx="4" fill="#858585" />
    <rect x="106" y="122" width="73" height="7" rx="3.5" fill="#505050" />
    <g transform="translate(214 126) scale(0.65)">
      <path d="M-7 0L-2 5L8 -6" fill="none" stroke="#505050" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <rect x="80" y="163" width="14" height="14" rx="4" fill="#858585" />
    <rect x="106" y="166" width="66" height="7" rx="3.5" fill="#858585" />
    <rect x="80" y="207" width="14" height="14" rx="4" fill="#858585" />
    <rect x="106" y="210" width="59" height="7" rx="3.5" fill="#858585" />
  </g>
</svg>
