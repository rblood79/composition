<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="Disclosure-title Disclosure-desc">
  <title id="Disclosure-title">Disclosure</title>
  <desc id="Disclosure-desc">투명 배경의 편집 가능한 무채색 Disclosure 컴포넌트 일러스트</desc>
  <defs>
    <linearGradient id="Disclosure-surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4f4f4" />
      <stop offset="1" stop-color="#dedede" />
    </linearGradient>
    <linearGradient id="Disclosure-ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#777777" />
      <stop offset="1" stop-color="#4c4c4c" />
    </linearGradient>
    <linearGradient id="Disclosure-wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e1e1e1" />
      <stop offset="1" stop-color="#b5b5b5" />
    </linearGradient>
    <linearGradient id="Disclosure-area" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#eeeeee" />
      <stop offset="1" stop-color="#555555" />
    </linearGradient>
    <linearGradient id="Disclosure-shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#303030" stop-opacity="0" />
      <stop offset="1" stop-color="#303030" stop-opacity=".8" />
    </linearGradient>
    <filter id="Disclosure-shadow" x="0" y="0" width="300" height="300" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity=".16" />
    </filter>
  </defs>
  <g id="Disclosure-illustration">
    <rect x="37" y="77" width="226" height="146" rx="18" fill="url(#Disclosure-surface)" stroke="#a1a1a1" stroke-width="1.5" filter="url(#Disclosure-shadow)" />
    <rect x="58" y="99" width="117" height="8" rx="4.0" fill="#505050" />
    <g transform="translate(237 103) rotate(0) scale(1)">
      <path d="M-5 -2L0 3L5 -2" fill="none" stroke="#505050" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <rect x="60" y="135" width="178" height="7" rx="3.5" fill="#858585" />
    <rect x="60" y="153" width="140" height="7" rx="3.5" fill="#b9b9b9" />
  </g>
</svg>
