<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="Image-title Image-desc">
  <title id="Image-title">Image</title>
  <desc id="Image-desc">투명 배경의 편집 가능한 무채색 Image 컴포넌트 일러스트</desc>
  <defs>
    <linearGradient id="Image-surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4f4f4" />
      <stop offset="1" stop-color="#dedede" />
    </linearGradient>
    <linearGradient id="Image-ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#777777" />
      <stop offset="1" stop-color="#4c4c4c" />
    </linearGradient>
    <linearGradient id="Image-wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e1e1e1" />
      <stop offset="1" stop-color="#b5b5b5" />
    </linearGradient>
    <linearGradient id="Image-area" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#eeeeee" />
      <stop offset="1" stop-color="#555555" />
    </linearGradient>
    <linearGradient id="Image-shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#303030" stop-opacity="0" />
      <stop offset="1" stop-color="#303030" stop-opacity=".8" />
    </linearGradient>
    <filter id="Image-shadow" x="0" y="0" width="300" height="300" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity=".16" />
    </filter>
  </defs>
  <g id="Image-illustration">
    <rect x="39" y="65" width="222" height="170" rx="18" fill="url(#Image-surface)" stroke="#a1a1a1" stroke-width="1.5" filter="url(#Image-shadow)" />
    <rect x="51" y="77" width="198" height="146" rx="10" fill="url(#Image-wash)" stroke="#b9b9b9" stroke-width="1" />
    <circle cx="195.54" cy="116.42" r="16.06" fill="#eeeeee" />
    <path d="M70.8 198.18L124.26 135.4L161.88 170.44L187.61999999999998 148.54L231.18 198.18Z" fill="#858585" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
