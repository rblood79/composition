<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="TextArea-title TextArea-desc">
  <title id="TextArea-title">TextArea</title>
  <desc id="TextArea-desc">투명 배경의 편집 가능한 무채색 TextArea 컴포넌트 일러스트</desc>
  <defs>
    <linearGradient id="TextArea-surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4f4f4" />
      <stop offset="1" stop-color="#dedede" />
    </linearGradient>
    <linearGradient id="TextArea-ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#777777" />
      <stop offset="1" stop-color="#4c4c4c" />
    </linearGradient>
    <linearGradient id="TextArea-wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e1e1e1" />
      <stop offset="1" stop-color="#b5b5b5" />
    </linearGradient>
    <linearGradient id="TextArea-area" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#eeeeee" />
      <stop offset="1" stop-color="#555555" />
    </linearGradient>
    <linearGradient id="TextArea-shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#303030" stop-opacity="0" />
      <stop offset="1" stop-color="#303030" stop-opacity=".8" />
    </linearGradient>
    <filter id="TextArea-shadow" x="0" y="0" width="300" height="300" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity=".16" />
    </filter>
  </defs>
  <g id="TextArea-illustration">
    <rect x="52" y="77" width="69" height="8" rx="4.0" fill="#767676" />
    <rect x="38" y="103" width="224" height="104" rx="12" fill="url(#TextArea-surface)" stroke="#a1a1a1" stroke-width="1.5" filter="url(#TextArea-shadow)" />
    <rect x="56" y="123" width="150" height="7" rx="3.5" fill="#858585" />
    <rect x="56" y="145" width="172" height="7" rx="3.5" fill="#858585" />
    <rect x="56" y="167" width="101" height="7" rx="3.5" fill="#858585" />
    <path d="M239 185L248 176" fill="none" stroke="#b9b9b9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M242 193L250 185" fill="none" stroke="#b9b9b9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
