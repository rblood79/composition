<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="Form-title Form-desc">
  <title id="Form-title">Form</title>
  <desc id="Form-desc">투명 배경의 편집 가능한 무채색 Form 컴포넌트 일러스트</desc>
  <defs>
    <linearGradient id="Form-surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4f4f4" />
      <stop offset="1" stop-color="#dedede" />
    </linearGradient>
    <linearGradient id="Form-ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#777777" />
      <stop offset="1" stop-color="#4c4c4c" />
    </linearGradient>
    <linearGradient id="Form-wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e1e1e1" />
      <stop offset="1" stop-color="#b5b5b5" />
    </linearGradient>
    <linearGradient id="Form-area" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#eeeeee" />
      <stop offset="1" stop-color="#555555" />
    </linearGradient>
    <linearGradient id="Form-shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#303030" stop-opacity="0" />
      <stop offset="1" stop-color="#303030" stop-opacity=".8" />
    </linearGradient>
    <filter id="Form-shadow" x="0" y="0" width="300" height="300" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity=".16" />
    </filter>
  </defs>
  <g id="Form-illustration">
    <rect x="52" y="32" width="196" height="236" rx="18" fill="url(#Form-surface)" stroke="#a1a1a1" stroke-width="1.5" filter="url(#Form-shadow)" />
    <rect x="70" y="53" width="88" height="10" rx="5.0" fill="#505050" />
    <rect x="70" y="89" width="50" height="6" rx="3.0" fill="#858585" />
    <rect x="70" y="105" width="160" height="32" rx="7" fill="#f1f1f1" stroke="#b9b9b9" stroke-width="1.5" />
    <rect x="81" y="118" width="89" height="6" rx="3.0" fill="#b9b9b9" />
    <rect x="70" y="151" width="50" height="6" rx="3.0" fill="#858585" />
    <rect x="70" y="167" width="160" height="32" rx="7" fill="#f1f1f1" stroke="#b9b9b9" stroke-width="1.5" />
    <rect x="81" y="180" width="89" height="6" rx="3.0" fill="#b9b9b9" />
    <rect x="139" y="221" width="91" height="30" rx="10" fill="url(#Form-ink)" stroke="#505050" stroke-width="1.5" />
    <rect x="161.75" y="233.0" width="45.5" height="6" rx="3.0" fill="#e9e9e9" />
  </g>
</svg>
