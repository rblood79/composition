<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="chart-line-title chart-line-desc">
  <title id="chart-line-title">chart-line</title>
  <desc id="chart-line-desc">투명 배경의 편집 가능한 무채색 chart-line 컴포넌트 일러스트</desc>
  <defs>
    <linearGradient id="chart-line-surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4f4f4" />
      <stop offset="1" stop-color="#dedede" />
    </linearGradient>
    <linearGradient id="chart-line-ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#777777" />
      <stop offset="1" stop-color="#4c4c4c" />
    </linearGradient>
    <linearGradient id="chart-line-wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e1e1e1" />
      <stop offset="1" stop-color="#b5b5b5" />
    </linearGradient>
    <linearGradient id="chart-line-area" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#eeeeee" />
      <stop offset="1" stop-color="#555555" />
    </linearGradient>
    <linearGradient id="chart-line-shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#303030" stop-opacity="0" />
      <stop offset="1" stop-color="#303030" stop-opacity=".8" />
    </linearGradient>
    <filter id="chart-line-shadow" x="0" y="0" width="300" height="300" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity=".16" />
    </filter>
  </defs>
  <g id="chart-line-illustration">
    <rect x="32" y="48" width="236" height="204" rx="18" fill="url(#chart-line-surface)" stroke="#a1a1a1" stroke-width="1.5" filter="url(#chart-line-shadow)" />
    <rect x="53" y="67" width="64" height="7" rx="3.5" fill="#505050" />
    <circle cx="232" cy="71" r="3" fill="#b9b9b9" />
    <path d="M56 107H245" fill="none" stroke="#dedede" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M56 143H245" fill="none" stroke="#dedede" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M56 179H245" fill="none" stroke="#dedede" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M56 215H245" fill="none" stroke="#dedede" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M56 98V215H245" fill="none" stroke="#b9b9b9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M62 192C82 192 83 148 108 154S139 190 155 151S185 143 197 124S225 115 240 103" fill="none" stroke="#505050" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="62" cy="192" r="4" fill="#eeeeee" stroke="#505050" stroke-width="2" />
    <circle cx="108" cy="154" r="4" fill="#eeeeee" stroke="#505050" stroke-width="2" />
    <circle cx="155" cy="151" r="4" fill="#eeeeee" stroke="#505050" stroke-width="2" />
    <circle cx="197" cy="124" r="4" fill="#eeeeee" stroke="#505050" stroke-width="2" />
    <circle cx="240" cy="103" r="4" fill="#eeeeee" stroke="#505050" stroke-width="2" />
  </g>
</svg>
