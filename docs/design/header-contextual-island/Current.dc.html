<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: Pretendard, -apple-system, BlinkMacSystemFont, system-ui, "Helvetica Neue", sans-serif; }
    a { color: oklch(70.7% 0.165 254.624); } a:hover { color: oklch(80% 0.12 254.624); }
    .app {
      --bg-overlay: oklch(27.4% 0.006 286.033);
      --bg-raised: #202023;
      --bg-inset: oklch(21% 0.006 285.885);
      --bg-muted: oklch(37% 0.013 285.805);
      --fg: oklch(96.7% 0.001 286.375);
      --fg-muted: oklch(70.5% 0.015 286.067);
      --border: oklch(37% 0.013 285.805);
      --accent: oklch(92% 0.004 286.32);
      --fg-on-accent: oklch(21% 0.006 285.885);
      --focus: oklch(70.7% 0.165 254.624);
      --chrome-shadow: 0 2px 8px rgb(0 0 0 / 0.24), 0 1px 4px rgb(0 0 0 / 0.12), 0 0 1px rgb(0 0 0 / 0.24);
      --chrome-shadow-floating: 0 12px 16px rgb(0 0 0 / 0.24), 0 6px 8px rgb(0 0 0 / 0.12), 0 0 6px rgb(0 0 0 / 0.48);
      width: 1440px; height: 900px; position: relative; overflow: hidden;
      background: var(--bg-overlay); color: var(--fg); font-size: 12px;
    }
    .island { background: var(--bg-raised); border-radius: 8px; padding: 4px; box-shadow: var(--chrome-shadow); display: flex; align-items: center; gap: 4px; }
    .ctl { width: 32px; height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: var(--fg-muted); flex: none; }
    .ctl.on { background: var(--accent); color: var(--fg-on-accent); }
    .ctl.sm { width: 28px; height: 28px; }
    .pnl { background: var(--bg-raised); border-radius: 8px; box-shadow: var(--chrome-shadow-floating); display: flex; flex-direction: column; overflow: hidden; }
    .pnl-grip { height: 14px; display: flex; align-items: flex-start; justify-content: center; padding-top: 4px; }
    .pnl-grip i { display: block; width: 28px; height: 4px; border-radius: 4px; background: var(--fg-muted); opacity: .55; }
    .pnl-body { flex: 1; background: var(--bg-inset); border-radius: 0 0 8px 8px; padding: 8px; min-height: 0; overflow: hidden; }
    .row { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 4px; color: var(--fg-muted); }
    .row.on { background: var(--bg-muted); color: var(--fg); }
    .sec { font-size: 10px; letter-spacing: .04em; text-transform: uppercase; color: var(--fg-muted); padding: 6px 6px 4px; }
    .fld { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 0; color: var(--fg-muted); }
    .fld b { font-weight: 400; color: var(--fg); background: var(--bg-overlay); border-radius: 4px; padding: 4px 8px; min-width: 56px; text-align: right; }
    .tag { position: absolute; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: oklch(70.7% 0.165 254.624); }
    .tag::before { content: ""; position: absolute; }
  </style>
</helmet>

<div class="app">

  <!-- HEADER 48px -->
  <div style="position: absolute; inset: 4px 4px auto 4px; height: 48px; display: flex; align-items: center; justify-content: space-between;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="width: 32px; height: 32px; border-radius: 6px; background: var(--bg-muted); display: flex; align-items: center; justify-content: center; color: var(--fg-muted);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </div>
      <div style="width: 32px; height: 32px; border-radius: 6px; background: linear-gradient(140deg, oklch(70.7% 0.165 254.624), oklch(60% 0.2 290)); "></div>
      <div style="font-weight: 600; color: var(--fg);">Acme Storefront</div>
    </div>

    <div class="island" style="gap: 4px;">
      <div class="ctl on"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg></div>
      <div class="ctl"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M12 18h.01"/></svg></div>
      <div class="ctl"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></svg></div>
      <div style="display: flex; align-items: center; height: 32px; border-radius: 6px; background: var(--bg-muted); padding: 0 6px 0 0;">
        <span style="width: 48px; text-align: center; font-weight: 500; color: var(--fg);">100%</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--fg-muted);"><path d="m6 9 6 6 6-6"/></svg>
      </div>
    </div>

    <div class="island">
      <div class="ctl"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 3v18"/></svg></div>
      <div class="ctl"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0"/><circle cx="12" cy="12" r="3"/></svg></div>
    </div>
  </div>

  <!-- LEFT RAIL -->
  <div class="island" style="position: absolute; left: 4px; top: 302px; flex-direction: column;">
    <div class="ctl on"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12h-8M21 6H8M21 18h-8M3 6v4a2 2 0 0 0 2 2h3M3 10v6a2 2 0 0 0 2 2h3"/></svg></div>
    <div class="ctl"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="13" y="3" width="8" height="8" rx="1"/><path d="M10 21V8a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-4a1 1 0 0 0-1-1H4"/></svg></div>
    <div class="ctl"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5M3 12a9 3 0 0 0 18 0"/></svg></div>
    <div class="ctl"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 17a4 4 0 0 1-8 0V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2Z"/><path d="m17 7-4.5-4.5M20 21h-9M7 17h.01"/></svg></div>
    <div class="ctl"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4M8 16h.01M16 16h.01"/></svg></div>
  </div>

  <!-- RIGHT RAIL -->
  <div class="island" style="position: absolute; right: 4px; top: 302px; flex-direction: column;">
    <div class="ctl on"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-9M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg></div>
    <div class="ctl on"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="14" height="6" rx="1"/><path d="M16 5h2a2 2 0 0 1 2 2v1a2 2 0 0 1-2 2h-6a2 2 0 0 0-2 2v1"/><rect x="9" y="15" width="6" height="7" rx="1"/></svg></div>
    <div class="ctl"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="12" height="12" rx="2"/><path d="m12 12 5.5 9 1.5-4.5L23.5 15Z"/></svg></div>
    <div class="ctl"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l4 2"/></svg></div>
    <div class="ctl"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/></svg></div>
  </div>

  <!-- CANVAS -->
  <div style="position: absolute; left: 344px; right: 344px; top: 56px; bottom: 4px; display: flex; align-items: center; justify-content: center;">
    <div style="width: 620px; height: 700px; background: #ffffff; border-radius: 2px; box-shadow: 0 24px 48px rgb(0 0 0 / .38); overflow: hidden; position: relative;">
      <div style="height: 56px; border-bottom: 1px solid #e8e8ea; display: flex; align-items: center; justify-content: space-between; padding: 0 20px;">
        <div style="width: 84px; height: 12px; border-radius: 2px; background: #1b1b1f;"></div>
        <div style="display: flex; gap: 14px;"><div style="width: 40px; height: 8px; border-radius: 2px; background: #c9c9cf;"></div><div style="width: 40px; height: 8px; border-radius: 2px; background: #c9c9cf;"></div><div style="width: 40px; height: 8px; border-radius: 2px; background: #c9c9cf;"></div></div>
      </div>
      <div style="padding: 44px 40px 0;">
        <div style="width: 300px; height: 26px; border-radius: 3px; background: #1b1b1f;"></div>
        <div style="width: 420px; height: 26px; border-radius: 3px; background: #1b1b1f; margin-top: 10px;"></div>
        <div style="width: 380px; height: 10px; border-radius: 2px; background: #b9b9c0; margin-top: 22px;"></div>
        <div style="width: 330px; height: 10px; border-radius: 2px; background: #b9b9c0; margin-top: 9px;"></div>
        <div style="display: flex; gap: 10px; margin-top: 28px;">
          <div style="width: 128px; height: 40px; border-radius: 6px; background: #1b1b1f; outline: 2px solid oklch(70.7% 0.165 254.624); outline-offset: 2px;"></div>
          <div style="width: 112px; height: 40px; border-radius: 6px; border: 1px solid #d5d5da;"></div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 46px;">
          <div style="height: 150px; border-radius: 6px; background: #f1f1f4;"></div>
          <div style="height: 150px; border-radius: 6px; background: #f1f1f4;"></div>
          <div style="height: 150px; border-radius: 6px; background: #f1f1f4;"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- LEFT PANEL -->
  <div class="pnl" style="position: absolute; left: 44px; top: 56px; width: 288px; height: 480px;">
    <div class="pnl-grip"><i></i></div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 8px 6px;"><span style="font-weight: 600;">Navigator</span><span style="color: var(--fg-muted);">···</span></div>
    <div class="pnl-body">
      <div class="row"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg><span>Body</span></div>
      <div class="row" style="padding-left: 20px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg><span>Header</span></div>
      <div class="row" style="padding-left: 20px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg><span>Hero</span></div>
      <div class="row" style="padding-left: 40px;">Heading</div>
      <div class="row" style="padding-left: 40px;">Paragraph</div>
      <div class="row on" style="padding-left: 40px;">Button — Shop now</div>
      <div class="row" style="padding-left: 40px;">Button — Learn more</div>
      <div class="row" style="padding-left: 20px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg><span>Feature grid</span></div>
      <div class="row" style="padding-left: 20px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg><span>Footer</span></div>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="pnl" style="position: absolute; right: 44px; top: 56px; width: 288px; height: 620px;">
    <div class="pnl-grip"><i></i></div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 8px 6px;"><span style="font-weight: 600;">Properties</span><span style="color: var(--fg-muted);">···</span></div>
    <div class="pnl-body">
      <div class="sec">Layout</div>
      <div class="fld"><span>Width</span><b>128</b></div>
      <div class="fld"><span>Height</span><b>40</b></div>
      <div class="fld"><span>X</span><b>240</b></div>
      <div class="fld"><span>Y</span><b>396</b></div>
      <div class="sec" style="margin-top: 10px;">Appearance</div>
      <div class="fld"><span>Fill</span><b>#1B1B1F</b></div>
      <div class="fld"><span>Radius</span><b>6</b></div>
      <div class="sec" style="margin-top: 10px;">Text</div>
      <div class="fld"><span>Size</span><b>14</b></div>
      <div class="fld"><span>Weight</span><b>600</b></div>
      <div class="fld"><span>Color</span><b>#FFFFFF</b></div>
    </div>
  </div>

  <!-- CONTEXTUAL ACTION BAR -->
  <div class="island" style="position: absolute; left: 50%; transform: translateX(-50%); bottom: 24px; gap: 2px;">
    <div style="width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; color: var(--fg-muted);">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 5h.01M9 12h.01M9 19h.01M15 5h.01M15 12h.01M15 19h.01"/></svg>
    </div>
    <div class="ctl sm"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18M7 6h10M7 12h6M7 18h13"/></svg></div>
    <div class="ctl sm"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M6 7h12M9 12h6M6 17h12"/></svg></div>
    <div class="ctl sm"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3v18M17 6H7M17 12h-6M17 18H4"/></svg></div>
    <div style="width: 1px; height: 18px; background: var(--border); margin: 0 4px;"></div>
    <div class="ctl sm"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 4H6a2 2 0 0 0-2 2v10"/></svg></div>
    <div class="ctl sm"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></div>
    <div style="width: 1px; height: 18px; background: var(--border); margin: 0 4px;"></div>
    <div class="ctl sm"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></div>
  </div>

</div>
</x-dc>
</body>
</html>
