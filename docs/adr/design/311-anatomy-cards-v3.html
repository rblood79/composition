<!doctype html>
<html lang="ko" data-theme="light" data-force="off">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>ADR-311 · Anatomy 카드 시안 3차</title>
    <style>
      :root {
        --page: #e5e5e5;
        --panel: #f9fafb;
        --card: #ffffff;
        --card-hover: #f9fafb;
        --border: #e5e7eb;
        --border-hover: #d1d5db;
        --fg: #1f2937;
        --fg-muted: #4b5563;
        --focus: #2563eb; /* --focus-ring */
        --guide: #3b82f6; /* --canvas-selection-strong */
        --guide-text: #2563eb; /* --focus-ring: 10px 글자 대비 4.5:1 */
        --f-strong: #374151;
        --on-strong: #ffffff;
        --f0: #ffffff;
        --f1: #f3f4f6;
        --f2: #e5e7eb;
        --f3: #9ca3af;
        --bd: #d1d5db;
        /* motion (자체 값) */
        --m-fast: 120ms;
        --m-base: 200ms;
        --m-slow: 320ms;
        --m-show: 700ms;
        --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      }
      :root[data-theme="dark"] {
        --page: #18181b;
        --panel: #202023;
        --card: #27272a;
        --card-hover: #202023;
        --border: #3f3f46;
        --border-hover: #52525b;
        --fg: #f4f4f5;
        --fg-muted: #d4d4d8;
        --focus: #60a5fa;
        --guide: #93c5fd;
        --guide-text: #93c5fd;
        --f-strong: #e4e4e7;
        --on-strong: #18181b;
        --f0: #18181b;
        --f1: #3f3f46;
        --f2: #52525b;
        --f3: #a1a1aa;
        --bd: #52525b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 16px;
        background: var(--page);
        color: var(--fg);
        font:
          12px/1.4 Pretendard,
          system-ui,
          -apple-system,
          sans-serif;
      }
      header.top {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 20px;
        align-items: center;
        margin-bottom: 12px;
      }
      header.top h1 {
        font-size: 14px;
        margin: 0 12px 0 0;
      }
      .ctl {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .ctl span {
        color: var(--fg-muted);
        margin-right: 4px;
      }
      .ctl button {
        font: inherit;
        color: var(--fg);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 3px 8px;
        cursor: pointer;
      }
      .ctl button[aria-pressed="true"] {
        border-color: var(--fg);
        background: var(--f1);
      }
      .note {
        color: var(--fg-muted);
        max-width: 960px;
        margin: 0 0 16px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
        align-items: flex-start;
      }
      .col h3 {
        font-size: 12px;
        margin: 0 0 4px;
      }
      .col .meta {
        color: var(--fg-muted);
        margin: 6px 0 0;
        max-width: 480px;
        font-variant-numeric: tabular-nums;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px;
      }
      .panel .sec {
        display: flex;
        justify-content: space-between;
        font-weight: 600;
        padding: 2px 2px 8px;
      }
      .panel .sec small {
        font-weight: 400;
        color: var(--fg-muted);
      }
      .grid {
        display: grid;
        gap: 8px;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      }
      .grid.small {
        grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      }

      /* ── 카드 ── */
      .card {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 6px;
        padding: 8px;
        margin: 0;
        font: inherit;
        color: var(--fg);
        text-align: center;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        cursor: crosshair;
        transition:
          background var(--m-base) ease,
          border-color var(--m-base) ease;
      }
      .card.tall {
        grid-row: span 2;
      }
      .card:hover {
        background: var(--card-hover);
        border-color: var(--border-hover);
      }
      .card:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: -2px;
      }
      .name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 11px;
        line-height: 14px;
      }
      .pv {
        position: relative;
        aspect-ratio: 3 / 2;
        container-type: inline-size;
      }
      .card.tall .pv {
        aspect-ratio: 3 / 4;
      }
      .pv svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        pointer-events: none;
      }

      /* ── 계층: outline(.sh) · content(.ct) · structure(.st) · measurement(.ms) · handle(.hd) · interactive ── */
      .pv svg * {
        vector-effect: non-scaling-stroke;
      }
      .sh,
      .ct,
      .slot {
        transition:
          fill var(--m-show) var(--ease-out),
          stroke var(--m-show) var(--ease-out),
          fill-opacity var(--m-show) var(--ease-out),
          stroke-opacity var(--m-show) var(--ease-out),
          opacity var(--m-base) ease;
      }
      .sh {
        fill: transparent;
        stroke: var(--fg);
        stroke-opacity: 0.85;
        stroke-width: 1.25px;
      }
      .ln {
        fill: none;
        stroke: var(--fg);
        stroke-opacity: 0.5;
        stroke-width: 1px;
      }
      .bar {
        fill: var(--fg);
        fill-opacity: 0.35;
        stroke: none;
      }
      .ic {
        fill: none;
        stroke: var(--fg);
        stroke-opacity: 0.85;
        stroke-width: 1.25px;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .slot {
        fill: transparent;
        stroke: var(--fg);
        stroke-opacity: 0.5;
        stroke-width: 1px;
        stroke-dasharray: 3 3;
      }
      .st,
      .ms,
      .hd,
      .txt,
      .memo {
        transition: opacity var(--m-slow) ease;
      }
      .st {
        fill: none;
        stroke: var(--guide);
        stroke-opacity: 0.6;
        stroke-width: 0.75px;
      }
      .st.dash {
        stroke-dasharray: 3 2;
      }
      .ms {
        fill: none;
        stroke: var(--guide);
        stroke-width: 0.75px;
      }
      .hd {
        fill: none;
        stroke: var(--guide);
        stroke-width: 4px;
        stroke-linecap: square;
      }
      .txt {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .txt span {
        position: absolute;
        transform: translate(-50%, -50%);
        padding: 0 2px;
        font:
          500 10px/12px Pretendard,
          ui-monospace,
          monospace;
        font-variant-numeric: tabular-nums;
        color: var(--guide-text);
        background: var(--card);
        white-space: nowrap;
      }
      .memo {
        font:
          10px/13px Pretendard,
          ui-monospace,
          monospace;
        color: var(--fg-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        display: none;
      }
      .grid.tier-l .memo {
        display: block;
      }
      .b {
        opacity: 0;
      }
      .chk {
        fill: none;
        stroke: var(--on-strong);
        stroke-width: 1.5px;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        transition: stroke-dashoffset var(--m-slow) var(--ease-out);
      }
      .press {
        transform-box: fill-box;
        transform-origin: center;
      }
      .spin {
        transform-box: fill-box;
        transform-origin: center;
      }

      /* ── 폭 단계 (미리보기 화면 폭): S <144 · M 144–260 · L ≥260. 치수선은 숫자와 함께만 나온다 ── */
      @container (max-width: 143.98px) {
        .t-m,
        .t-l {
          display: none;
        }
      }
      @container (max-width: 259.98px) {
        .t-l {
          display: none;
        }
      }
      @container (min-width: 260px) {
        .txt span {
          font-size: 11px;
        }
      }

      /* ── rendered: 카드 :hover · :focus-visible (JS 상태 없음) ── */
      :is(.card:hover, .card:focus-visible, [data-force="rendered"] .card)
        :is(.st, .ms, .hd, .txt, .memo) {
        opacity: 0;
      }
      :is(.card:hover, .card:focus-visible, [data-force="rendered"] .card) .sh {
        stroke: var(--bd);
        stroke-opacity: 1;
      }
      :is(.card:hover, .card:focus-visible, [data-force="rendered"] .card)
        .sh.fs {
        fill: var(--f-strong);
        stroke: var(--f-strong);
      }
      :is(.card:hover, .card:focus-visible, [data-force="rendered"] .card)
        .sh.f0 {
        fill: var(--f0);
      }
      :is(.card:hover, .card:focus-visible, [data-force="rendered"] .card)
        .sh.f1 {
        fill: var(--f1);
      }
      :is(.card:hover, .card:focus-visible, [data-force="rendered"] .card)
        .sh.f2 {
        fill: var(--f2);
        stroke: var(--f2);
      }
      :is(.card:hover, .card:focus-visible, [data-force="rendered"] .card)
        .sh.f3 {
        fill: var(--f3);
        stroke: var(--f3);
      }
      :is(.card:hover, .card:focus-visible, [data-force="rendered"] .card)
        .bar {
        fill-opacity: 0.6;
      }
      :is(.card:hover, .card:focus-visible, [data-force="rendered"] .card)
        .bar.on {
        fill: var(--on-strong);
        fill-opacity: 1;
      }
      :is(.card:hover, .card:focus-visible, [data-force="rendered"] .card)
        .ic.on {
        stroke: var(--on-strong);
        stroke-opacity: 1;
      }
      :is(.card:hover, .card:focus-visible, [data-force="rendered"] .card) .ln {
        stroke: var(--bd);
        stroke-opacity: 1;
      }
      :is(.card:hover, .card:focus-visible, [data-force="rendered"] .card)
        .slot {
        fill: var(--f1);
        stroke: var(--bd);
        stroke-opacity: 1;
      }
      /* 컴포넌트 전용 연출 — catalog 상태 쌍 (pressed → pending, selected) */
      :is(.card:hover, .card:focus-visible) .press {
        animation: press var(--m-slow) ease-out 550ms both;
      }
      :is(.card:hover, .card:focus-visible, [data-force="rendered"] .card) .a {
        opacity: 0;
        transition: opacity var(--m-base) ease 700ms;
      }
      :is(.card:hover, .card:focus-visible, [data-force="rendered"] .card) .b {
        opacity: 1;
        transition: opacity var(--m-base) ease 700ms;
      }
      :is(.card:hover, .card:focus-visible) .spin {
        animation: spin 900ms linear 700ms 1;
      }
      :is(.card:hover, .card:focus-visible, [data-force="rendered"] .card)
        .chk {
        stroke-dashoffset: 0;
        transition-delay: 350ms;
      }
      @keyframes press {
        40% {
          transform: scale(0.97);
        }
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ── 진입 연출: 카드가 처음 그려질 때 한 번. idle 반복 없음 ── */
      .enter .sh {
        animation: ink 500ms var(--ease-out) var(--d, 0ms) backwards;
      }
      .enter .st {
        animation: fade var(--m-slow) ease calc(var(--d, 0ms) + 200ms) backwards;
      }
      .enter :is(.ct, .slot) {
        animation: fade var(--m-slow) ease calc(var(--d, 0ms) + 400ms) backwards;
      }
      .enter :is(.ms, .txt span) {
        animation: fade var(--m-base) ease
          calc(var(--d, 0ms) + 550ms + var(--i, 0) * 70ms) backwards;
      }
      .enter .hd {
        animation: pop var(--m-base) var(--ease-out) calc(var(--d, 0ms) + 600ms)
          backwards;
      }
      .enter .memo {
        animation: fade var(--m-slow) ease calc(var(--d, 0ms) + 700ms) backwards;
      }
      @keyframes ink {
        from {
          stroke-dasharray: 1 1;
          stroke-dashoffset: 1;
        }
        to {
          stroke-dasharray: 1 1;
          stroke-dashoffset: 0;
        }
      }
      @keyframes fade {
        from {
          opacity: 0;
        }
      }
      @keyframes pop {
        from {
          stroke-width: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .pv svg *,
        .txt,
        .txt span,
        .memo,
        .card {
          transition: none !important;
          animation: none !important;
        }
      }
      body {
        max-width: 1220px;
        margin-inline: auto;
        padding: clamp(16px, 3vw, 40px);
      }
      header.top {
        padding-bottom: 14px;
        border-bottom: 1px solid var(--border-hover);
      }
      header.top h1 {
        margin-right: auto;
      }
      .ctl button,
      summary {
        min-height: 32px;
      }
      .comparison {
        padding-block: 18px 12px;
      }
      .comparison h2 {
        font-size: clamp(22px, 3vw, 32px);
        letter-spacing: -0.04em;
        margin: 0 0 6px;
      }
      #cases {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 228px), 1fr));
        gap: 14px;
        max-width: 960px;
      }
      .case-card {
        width: 100%;
        min-width: 0;
        border-radius: 12px;
        text-align: left;
        padding: 12px;
        cursor: default;
      }
      .case-card .pv {
        display: block;
        width: 100%;
        background: radial-gradient(
            circle,
            var(--border) 0.75px,
            transparent 1px
          )
          50% 50% / 12px 12px;
      }
      .case-card .case-title {
        font-size: 15px;
        font-weight: 650;
        margin-top: 4px;
      }
      .case-card .caption,
      .source-note {
        color: var(--fg-muted);
        font-size: 12px;
      }
      .case-card .caption {
        min-height: 2.8em;
      }
      .source-note {
        margin: 12px 0;
      }
      .reference {
        border-top: 1px solid var(--border-hover);
        padding-top: 12px;
      }
      summary {
        width: fit-content;
        cursor: pointer;
        font-weight: 600;
      }
      .col,
      .panel {
        max-width: 100%;
      }
      .case-card .region {
        fill: var(--card);
        stroke: none;
      }
      .case-card .edge {
        fill: none;
        stroke: var(--fg);
        stroke-width: 1.25px;
      }
      .card .seam {
        fill: none;
        stroke: var(--guide-text);
        stroke-width: 1px;
        stroke-dasharray: 3 2;
      }
      :is(.card:hover, .card:focus-visible, [data-force="rendered"] .card)
        .seam {
        stroke: var(--fg-muted);
        stroke-dasharray: none;
      }
      :is(
          .case-card:hover,
          .case-card:focus-visible,
          [data-force="rendered"] .case-card
        )
        .region.side {
        fill: var(--f2);
      }
      :is(
          .case-card:hover,
          .case-card:focus-visible,
          [data-force="rendered"] .case-card
        )
        .region.content {
        fill: var(--f1);
      }
      :is(
          .case-card:hover,
          .case-card:focus-visible,
          [data-force="rendered"] .case-card
        )
        .edge {
        stroke: var(--fg-muted);
      }
      @media (prefers-reduced-motion: no-preference) {
        .case-card :is(.region, .edge, .seam) {
          transition:
            fill 700ms var(--ease-out),
            stroke 700ms var(--ease-out);
        }
        .enter .case-card .edge {
          animation: ink 500ms var(--ease-out) var(--d) backwards;
        }
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 238px), 1fr));
        gap: 14px;
        max-width: 960px;
        align-items: stretch;
        grid-auto-flow: dense;
      }
      .gallery .card {
        justify-content: start;
        text-align: start;
        padding: 12px;
        min-width: 0;
        cursor: default;
      }
      .gallery .name {
        font-size: 15px;
        font-weight: 650;
        line-height: 20px;
      }
      .gallery .pv {
        background: radial-gradient(
            circle,
            var(--border) 0.75px,
            transparent 1px
          )
          50% 50% / 12px 12px;
      }
      .gallery .relation {
        color: var(--fg-muted);
        line-height: 1.45;
      }
      .option {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        margin-bottom: 12px;
      }
      .gallery .card.tall {
        justify-content: center;
      }
      .card .sh.paint {
        stroke-width: 0;
      }
      @media (prefers-reduced-motion: no-preference) {
        .card .seam {
          transition: stroke var(--m-show) var(--ease-out);
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <h1>ADR-311 · Anatomy 카드 시안 3차</h1>
      <div class="ctl" data-attr="theme">
        <span>테마</span>
        <button data-v="light">라이트</button>
        <button data-v="dark">다크</button>
      </div>
      <div class="ctl" data-attr="force">
        <span>상태</span>
        <button data-v="off">개별 비교</button>
        <button data-v="rendered">완성 상태 고정</button>
      </div>
      <div class="ctl"><button id="replay">진입 연출 다시 재생</button></div>
    </header>
    <main id="main" class="enter">
      <section class="comparison" aria-labelledby="components-title">
        <h2 id="components-title">컴포넌트 Anatomy</h2>
        <p class="note">
          파란 점선은 공유 경계, 숫자가 붙은 치수선은 실제 간격입니다. 카드에
          포인터를 올리거나 Tab으로 이동해 완성 상태와 비교하세요.
        </p>
        <label class="option"
          ><input id="button-icon" type="checkbox" checked /> Button 아이콘
          표시</label
        >
        <div id="examples" class="gallery"></div>
      </section>
      <section class="comparison" aria-labelledby="comparison-title">
        <h2 id="comparison-title">레이아웃의 접합부</h2>
        <p class="note">
          사이드바와 콘텐츠 슬롯의 경계를 비교하세요. 카드에 포인터를 올리거나
          Tab으로 이동하면 완성 상태가 보입니다.
        </p>
        <div id="cases"></div>
        <p class="source-note">
          설계용 Layout 예시 · 치수는 샘플 좌표계의 px입니다.
        </p>
      </section>
      <details class="reference">
        <summary>6종 카드 · 패널 폭별 비교</summary>
        <div id="panels"></div>
      </details>
    </main>

    <script>
      // ───────── helpers: 좌표 = 컴포넌트 실제 px, u = 가이드 간격 단위 (viewBox 폭 비례) ─────────
      const T = (tier) => (tier === "s" ? "" : " t-" + tier);
      const G = (u) => ({
        handles: (x1, y1, x2, y2) =>
          `<path class="hd" d="M${x1} ${y1}h.01M${x2} ${y1}h.01M${x1} ${y2}h.01M${x2} ${y2}h.01"/>`,
        frame: (x1, y1, x2, y2) =>
          `<rect class="st" x="${x1}" y="${y1}" width="${x2 - x1}" height="${y2 - y1}"/>`,
        dimH: (x1, x2, y, tier, i = 0) =>
          `<path class="ms${T(tier)}" style="--i:${i}" d="M${x1} ${y}H${x2}M${x1} ${y - 3 * u}v${6 * u}M${x2} ${y - 3 * u}v${6 * u}"/>`,
        dimV: (x, y1, y2, tier, i = 0) =>
          `<path class="ms${T(tier)}" style="--i:${i}" d="M${x} ${y1}V${y2}M${x - 3 * u} ${y1}h${6 * u}M${x - 3 * u} ${y2}h${6 * u}"/>`,
        dashV: (x, y1, y2, tier = "m") =>
          `<path class="st dash${T(tier)}" d="M${x} ${y1}V${y2}"/>`,
        dashRect: (x, y, w, h, tier = "m") =>
          `<rect class="st dash${T(tier)}" x="${x}" y="${y}" width="${w}" height="${h}"/>`,
      });
      const bar = (x, y, w, h = 6, cls = "") =>
        `<rect class="ct bar ${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="${h / 2}"/>`;

      const sharedEdge = (parts, path) =>
        `<path class="seam" data-shared-guide="${parts}" d="${path}"/>`;
      const part = (key, shapes) => `<g data-part="${key}">${shapes}</g>`;
      // 한 쌍의 실제 끝점에서 치수선과 수치를 함께 만든다.
      function horizontalGap(g, parts, left, right, y, tier, labelOffset) {
        return {
          svg: `<g data-gap="${parts}">${g.dimH(left, right, y, tier)}</g>`,
          label: {

        const minW = 155;

        return [x - (W - w) / 2, y - (H - h) / 2, W, H];

      const main = document.getElementById("main");
      // 같은 Layout의 세 fixture. 수평으로 맞닿는 영역은 외곽선을 열고 이음새 한 개를 공유한다.
      function layoutCase({ key, title, description, sideWidth, gap }, index) {
        const width = 156;
        const height = 64;
        const radius = 6;
        const rightStart = sideWidth ? sideWidth + gap : 0;
        const joined = sideWidth > 0 && rightStart === sideWidth;
        const regionPath = (left, right, joinLeft, joinRight, fill = false) => {
          const l = joinLeft ? 0 : radius;
          const r = joinRight ? 0 : radius;
          const top = `M${left + l} 0 H${right - r} Q${right} 0 ${right} ${r}`;
          const outerRight =
            joinRight && !fill
              ? `M${right} ${height}`
              : `V${height - r} Q${right} ${height} ${right - r} ${height}`;
          const bottom = `H${left + l} Q${left} ${height} ${left} ${height - l}`;
          const outerLeft =
            joinLeft && !fill ? "" : `V${l} Q${left} 0 ${left + l} 0`;
          return top + outerRight + bottom + outerLeft + (fill ? "Z" : "");
        };
        const region = (role, left, right, joinLeft, joinRight, details) => {
          const outlinePath = regionPath(left, right, joinLeft, joinRight);
          const fillPath = regionPath(left, right, joinLeft, joinRight, true);
          return `<g data-part="${role}"><path class="region ${role}" d="${fillPath}"/>
            <path class="edge" pathLength="1" d="${outlinePath}"/>${details}</g>`;

      measure();
      requestAnimationFrame(measure);

      const root = document.documentElement;
      const sync = () =>
        document.querySelectorAll(".ctl[data-attr]").forEach((c) =>
          c.querySelectorAll("button").forEach((b) => {
            b.setAttribute(
              "aria-pressed",
              String(root.dataset[c.dataset.attr] === b.dataset.v),
            );
          }),
        );
      document.querySelectorAll(".ctl[data-attr] button").forEach((b) =>
        b.addEventListener("click", () => {
          root.dataset[b.parentElement.dataset.attr] = b.dataset.v;
          sync();
        }),
      );
      sync();
      document.getElementById("replay").addEventListener("click", () => {
        main.classList.remove("enter");
        void main.offsetWidth;
        main.classList.add("enter");
      });
    </script>
  </body>
</html>
