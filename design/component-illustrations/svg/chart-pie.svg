<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="chart-pie-title chart-pie-desc">
  <title id="chart-pie-title">chart-pie</title>
  <desc id="chart-pie-desc">투명 배경의 편집 가능한 무채색 chart-pie 컴포넌트 일러스트</desc>
  <defs>
    <linearGradient id="chart-pie-surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4f4f4" />
      <stop offset="1" stop-color="#dedede" />
    </linearGradient>
    <linearGradient id="chart-pie-ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#777777" />
      <stop offset="1" stop-color="#4c4c4c" />
    </linearGradient>
    <linearGradient id="chart-pie-wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e1e1e1" />
      <stop offset="1" stop-color="#b5b5b5" />
    </linearGradient>
    <linearGradient id="chart-pie-area" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#eeeeee" />
      <stop offset="1" stop-color="#555555" />
    </linearGradient>
    <linearGradient id="chart-pie-shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#303030" stop-opacity="0" />
      <stop offset="1" stop-color="#303030" stop-opacity=".8" />
    </linearGradient>
    <filter id="chart-pie-shadow" x="0" y="0" width="300" height="300" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity=".16" />
    </filter>
  </defs>
  <g id="chart-pie-illustration">
    <rect x="32" y="48" width="236" height="204" rx="18" fill="url(#chart-pie-surface)" stroke="#a1a1a1" stroke-width="1.5" filter="url(#chart-pie-shadow)" />
    <rect x="53" y="67" width="64" height="7" rx="3.5" fill="#505050" />
    <circle cx="232" cy="71" r="3" fill="#b9b9b9" />
    <circle cx="149" cy="160" r="66" fill="#b9b9b9" />
    <path d="M149 160V94A66 66 0 0 1 206.16 193Z" fill="#505050" stroke="#ededed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M149 160L206.16 193A66 66 0 0 1 92 193Z" fill="#858585" stroke="#ededed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
