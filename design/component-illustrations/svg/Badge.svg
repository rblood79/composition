<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="Badge-title Badge-desc">
  <title id="Badge-title">Badge</title>
  <desc id="Badge-desc">투명 배경의 편집 가능한 무채색 Badge 컴포넌트 일러스트</desc>
  <defs>
    <linearGradient id="Badge-surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4f4f4" />
      <stop offset="1" stop-color="#dedede" />
    </linearGradient>
    <linearGradient id="Badge-ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#777777" />
      <stop offset="1" stop-color="#4c4c4c" />
    </linearGradient>
    <linearGradient id="Badge-wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e1e1e1" />
      <stop offset="1" stop-color="#b5b5b5" />
    </linearGradient>
    <linearGradient id="Badge-area" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#eeeeee" />
      <stop offset="1" stop-color="#555555" />
    </linearGradient>
    <linearGradient id="Badge-shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#303030" stop-opacity="0" />
      <stop offset="1" stop-color="#303030" stop-opacity=".8" />
    </linearGradient>
    <filter id="Badge-shadow" x="0" y="0" width="300" height="300" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity=".16" />
    </filter>
  </defs>
  <g id="Badge-illustration">
    <rect x="60" y="107" width="180" height="86" rx="28" fill="url(#Badge-surface)" stroke="#a1a1a1" stroke-width="1.5" filter="url(#Badge-shadow)" />
    <circle cx="91" cy="150" r="10" fill="#858585" />
    <rect x="113" y="144" width="99" height="12" rx="6.0" fill="#505050" />
  </g>
</svg>
