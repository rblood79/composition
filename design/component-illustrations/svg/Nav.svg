<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="Nav-title Nav-desc">
  <title id="Nav-title">Nav</title>
  <desc id="Nav-desc">투명 배경의 편집 가능한 무채색 Nav 컴포넌트 일러스트</desc>
  <defs>
    <linearGradient id="Nav-surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4f4f4" />
      <stop offset="1" stop-color="#dedede" />
    </linearGradient>
    <linearGradient id="Nav-ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#777777" />
      <stop offset="1" stop-color="#4c4c4c" />
    </linearGradient>
    <linearGradient id="Nav-wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e1e1e1" />
      <stop offset="1" stop-color="#b5b5b5" />
    </linearGradient>
    <linearGradient id="Nav-area" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#eeeeee" />
      <stop offset="1" stop-color="#555555" />
    </linearGradient>
    <linearGradient id="Nav-shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#303030" stop-opacity="0" />
      <stop offset="1" stop-color="#303030" stop-opacity=".8" />
    </linearGradient>
    <filter id="Nav-shadow" x="0" y="0" width="300" height="300" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity=".16" />
    </filter>
  </defs>
  <g id="Nav-illustration">
    <rect x="27" y="109" width="246" height="82" rx="18" fill="url(#Nav-surface)" stroke="#a1a1a1" stroke-width="1.5" filter="url(#Nav-shadow)" />
    <rect x="40" y="124" width="70" height="50" rx="10" fill="#dedede" />
    <rect x="51" y="144" width="48" height="8" rx="4.0" fill="#505050" />
    <rect x="125" y="144" width="51" height="8" rx="4.0" fill="#858585" />
    <rect x="197" y="144" width="47" height="8" rx="4.0" fill="#858585" />
    <rect x="51" y="170" width="48" height="3" rx="1.5" fill="#505050" />
  </g>
</svg>
