<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="SideNav-title SideNav-desc">
  <title id="SideNav-title">SideNav</title>
  <desc id="SideNav-desc">투명 배경의 편집 가능한 무채색 SideNav 컴포넌트 일러스트</desc>
  <defs>
    <linearGradient id="SideNav-surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4f4f4" />
      <stop offset="1" stop-color="#dedede" />
    </linearGradient>
    <linearGradient id="SideNav-ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#777777" />
      <stop offset="1" stop-color="#4c4c4c" />
    </linearGradient>
    <linearGradient id="SideNav-wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e1e1e1" />
      <stop offset="1" stop-color="#b5b5b5" />
    </linearGradient>
    <linearGradient id="SideNav-area" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#eeeeee" />
      <stop offset="1" stop-color="#555555" />
    </linearGradient>
    <linearGradient id="SideNav-shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#303030" stop-opacity="0" />
      <stop offset="1" stop-color="#303030" stop-opacity=".8" />
    </linearGradient>
    <filter id="SideNav-shadow" x="0" y="0" width="300" height="300" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity=".16" />
    </filter>
  </defs>
  <g id="SideNav-illustration">
    <rect x="71" y="40" width="158" height="220" rx="18" fill="url(#SideNav-surface)" stroke="#a1a1a1" stroke-width="1.5" filter="url(#SideNav-shadow)" />
    <rect x="85" y="94" width="130" height="30" rx="8" fill="#dedede" />
    <rect x="96" y="104" width="10" height="10" rx="3" fill="#505050" />
    <rect x="118" y="106" width="75" height="6" rx="3.0" fill="#505050" />
    <rect x="96" y="140" width="10" height="10" rx="3" fill="#858585" />
    <rect x="118" y="142" width="67" height="6" rx="3.0" fill="#858585" />
    <rect x="96" y="176" width="10" height="10" rx="3" fill="#858585" />
    <rect x="118" y="178" width="59" height="6" rx="3.0" fill="#858585" />
    <rect x="96" y="212" width="10" height="10" rx="3" fill="#858585" />
    <rect x="118" y="214" width="51" height="6" rx="3.0" fill="#858585" />
  </g>
</svg>
