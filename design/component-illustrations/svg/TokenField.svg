<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="TokenField-title TokenField-desc">
  <title id="TokenField-title">TokenField</title>
  <desc id="TokenField-desc">투명 배경의 편집 가능한 무채색 TokenField 컴포넌트 일러스트</desc>
  <defs>
    <linearGradient id="TokenField-surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4f4f4" />
      <stop offset="1" stop-color="#dedede" />
    </linearGradient>
    <linearGradient id="TokenField-ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#777777" />
      <stop offset="1" stop-color="#4c4c4c" />
    </linearGradient>
    <linearGradient id="TokenField-wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e1e1e1" />
      <stop offset="1" stop-color="#b5b5b5" />
    </linearGradient>
    <linearGradient id="TokenField-area" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#eeeeee" />
      <stop offset="1" stop-color="#555555" />
    </linearGradient>
    <linearGradient id="TokenField-shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#303030" stop-opacity="0" />
      <stop offset="1" stop-color="#303030" stop-opacity=".8" />
    </linearGradient>
    <filter id="TokenField-shadow" x="0" y="0" width="300" height="300" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity=".16" />
    </filter>
  </defs>
  <g id="TokenField-illustration">
    <rect x="52" y="77" width="69" height="8" rx="4.0" fill="#767676" />
    <rect x="38" y="103" width="224" height="104" rx="12" fill="url(#TokenField-surface)" stroke="#a1a1a1" stroke-width="1.5" filter="url(#TokenField-shadow)" />
    <rect x="54" y="117" width="87" height="29" rx="8" fill="#dedede" />
    <rect x="64" y="128" width="51" height="6" rx="3.0" fill="#505050" />
    <g transform="translate(129 131) scale(0.7)">
      <path d="M-4 -4L4 4M-4 4L4 -4" fill="none" stroke="#858585" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <rect x="152" y="117" width="88" height="29" rx="8" fill="#dedede" />
    <rect x="162" y="128" width="52" height="6" rx="3.0" fill="#505050" />
