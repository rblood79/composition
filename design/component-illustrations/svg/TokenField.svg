      <path d="M-4 -4L4 4M-4 4L4 -4" fill="none" stroke="#858585" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <rect x="54" y="157" width="107" height="29" rx="8" fill="#dedede" />
    <rect x="64" y="168" width="71" height="6" rx="3.0" fill="#505050" />
    <g transform="translate(149 171) scale(0.7)">
      <path d="M-4 -4L4 4M-4 4L4 -4" fill="none" stroke="#858585" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <path d="M174 164L174 179" fill="none" stroke="#505050" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
