<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="Popover-title Popover-desc">
  <title id="Popover-title">Popover</title>
  <desc id="Popover-desc">투명 배경의 편집 가능한 무채색 Popover 컴포넌트 일러스트</desc>
  <defs>
    <linearGradient id="Popover-surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4f4f4" />
      <stop offset="1" stop-color="#dedede" />
    </linearGradient>
    <linearGradient id="Popover-ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#777777" />
      <stop offset="1" stop-color="#4c4c4c" />
    </linearGradient>
    <linearGradient id="Popover-wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e1e1e1" />
      <stop offset="1" stop-color="#b5b5b5" />
    </linearGradient>
    <linearGradient id="Popover-area" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#eeeeee" />
      <stop offset="1" stop-color="#555555" />
    </linearGradient>
    <linearGradient id="Popover-shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#303030" stop-opacity="0" />
      <stop offset="1" stop-color="#303030" stop-opacity=".8" />
    </linearGradient>
    <filter id="Popover-shadow" x="0" y="0" width="300" height="300" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity=".16" />
    </filter>
  </defs>
  <g id="Popover-illustration">
    <rect x="45" y="63" width="210" height="124" rx="15" fill="url(#Popover-surface)" stroke="#a1a1a1" stroke-width="1.5" filter="url(#Popover-shadow)" />
    <path d="M139 186L150 198L161 186" fill="#dedede" stroke="#b9b9b9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="64" y="85" width="124" height="9" rx="4.5" fill="#505050" />
    <rect x="64" y="112" width="170" height="6" rx="3.0" fill="#858585" />
    <rect x="64" y="129" width="147" height="6" rx="3.0" fill="#858585" />
    <rect x="64" y="158" width="66" height="6" rx="3.0" fill="#505050" />
    <rect x="99" y="217" width="102" height="36" rx="10" fill="url(#Popover-surface)" stroke="#b9b9b9" stroke-width="1.5" />
    <rect x="124.5" y="232.0" width="51.0" height="6" rx="3.0" fill="#505050" />
  </g>
</svg>
