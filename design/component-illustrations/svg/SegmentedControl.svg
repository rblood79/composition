<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="SegmentedControl-title SegmentedControl-desc">
  <title id="SegmentedControl-title">SegmentedControl</title>
  <desc id="SegmentedControl-desc">투명 배경의 편집 가능한 무채색 SegmentedControl 컴포넌트 일러스트</desc>
  <defs>
    <linearGradient id="SegmentedControl-surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4f4f4" />
      <stop offset="1" stop-color="#dedede" />
    </linearGradient>
    <linearGradient id="SegmentedControl-ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#777777" />
      <stop offset="1" stop-color="#4c4c4c" />
    </linearGradient>
    <linearGradient id="SegmentedControl-wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e1e1e1" />
      <stop offset="1" stop-color="#b5b5b5" />
    </linearGradient>
    <linearGradient id="SegmentedControl-area" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#eeeeee" />
      <stop offset="1" stop-color="#555555" />
    </linearGradient>
    <linearGradient id="SegmentedControl-shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#303030" stop-opacity="0" />
      <stop offset="1" stop-color="#303030" stop-opacity=".8" />
    </linearGradient>
    <filter id="SegmentedControl-shadow" x="0" y="0" width="300" height="300" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity=".16" />
    </filter>
  </defs>
  <g id="SegmentedControl-illustration">
    <rect x="28" y="109" width="244" height="82" rx="20" fill="url(#SegmentedControl-surface)" stroke="#a1a1a1" stroke-width="1.5" filter="url(#SegmentedControl-shadow)" />
    <rect x="41" y="124" width="70" height="52" rx="10" fill="url(#SegmentedControl-surface)" stroke="#b9b9b9" stroke-width="1.5" />
    <rect x="58.5" y="147.0" width="35.0" height="6" rx="3.0" fill="#505050" />
    <rect x="115" y="124" width="70" height="52" rx="10" fill="url(#SegmentedControl-ink)" stroke="#505050" stroke-width="1.5" />
    <rect x="132.5" y="147.0" width="35.0" height="6" rx="3.0" fill="#e9e9e9" />
    <rect x="189" y="124" width="70" height="52" rx="10" fill="url(#SegmentedControl-surface)" stroke="#b9b9b9" stroke-width="1.5" />
    <rect x="206.5" y="147.0" width="35.0" height="6" rx="3.0" fill="#505050" />
  </g>
</svg>
