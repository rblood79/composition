<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="Link-title Link-desc">
  <title id="Link-title">Link</title>
  <desc id="Link-desc">투명 배경의 편집 가능한 무채색 Link 컴포넌트 일러스트</desc>
  <defs>
    <linearGradient id="Link-surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4f4f4" />
      <stop offset="1" stop-color="#dedede" />
    </linearGradient>
    <linearGradient id="Link-ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#777777" />
      <stop offset="1" stop-color="#4c4c4c" />
    </linearGradient>
    <linearGradient id="Link-wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e1e1e1" />
      <stop offset="1" stop-color="#b5b5b5" />
    </linearGradient>
    <linearGradient id="Link-area" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#eeeeee" />
      <stop offset="1" stop-color="#555555" />
    </linearGradient>
    <linearGradient id="Link-shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#303030" stop-opacity="0" />
      <stop offset="1" stop-color="#303030" stop-opacity=".8" />
    </linearGradient>
    <filter id="Link-shadow" x="0" y="0" width="300" height="300" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity=".16" />
    </filter>
  </defs>
  <g id="Link-illustration">
    <rect x="61" y="110" width="178" height="80" rx="18" fill="url(#Link-surface)" stroke="#a1a1a1" stroke-width="1.5" filter="url(#Link-shadow)" />
    <rect x="83" y="140" width="108" height="10" rx="5.0" fill="#505050" />
    <path d="M83 159H191" fill="none" stroke="#505050" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M205 151L219 137M209 137H219V147" fill="none" stroke="#505050" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
