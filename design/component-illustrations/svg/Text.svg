<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="Text-title Text-desc">
  <title id="Text-title">Text</title>
  <desc id="Text-desc">투명 배경의 편집 가능한 무채색 Text 컴포넌트 일러스트</desc>
  <defs>
    <linearGradient id="Text-surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4f4f4" />
      <stop offset="1" stop-color="#dedede" />
    </linearGradient>
    <linearGradient id="Text-ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#777777" />
      <stop offset="1" stop-color="#4c4c4c" />
    </linearGradient>
    <linearGradient id="Text-wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e1e1e1" />
      <stop offset="1" stop-color="#b5b5b5" />
    </linearGradient>
    <linearGradient id="Text-area" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#eeeeee" />
      <stop offset="1" stop-color="#555555" />
    </linearGradient>
    <linearGradient id="Text-shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#303030" stop-opacity="0" />
      <stop offset="1" stop-color="#303030" stop-opacity=".8" />
    </linearGradient>
    <filter id="Text-shadow" x="0" y="0" width="300" height="300" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity=".16" />
    </filter>
  </defs>
  <g id="Text-illustration">
    <rect x="42" y="78" width="216" height="144" rx="18" fill="url(#Text-surface)" stroke="#a1a1a1" stroke-width="1.5" filter="url(#Text-shadow)" />
    <rect x="66" y="103" width="128" height="13" rx="6.5" fill="#505050" />
    <rect x="66" y="134" width="168" height="8" rx="4.0" fill="#858585" />
    <rect x="66" y="156" width="150" height="8" rx="4.0" fill="#858585" />
    <rect x="66" y="178" width="110" height="8" rx="4.0" fill="#858585" />
  </g>
</svg>
