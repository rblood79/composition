<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="ProgressBar-title ProgressBar-desc">
  <title id="ProgressBar-title">ProgressBar</title>
  <desc id="ProgressBar-desc">투명 배경의 편집 가능한 무채색 ProgressBar 컴포넌트 일러스트</desc>
  <defs>
    <linearGradient id="ProgressBar-surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4f4f4" />
      <stop offset="1" stop-color="#dedede" />
    </linearGradient>
    <linearGradient id="ProgressBar-ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#777777" />
      <stop offset="1" stop-color="#4c4c4c" />
    </linearGradient>
    <linearGradient id="ProgressBar-wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e1e1e1" />
      <stop offset="1" stop-color="#b5b5b5" />
    </linearGradient>
    <linearGradient id="ProgressBar-area" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#eeeeee" />
      <stop offset="1" stop-color="#555555" />
    </linearGradient>
    <linearGradient id="ProgressBar-shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#303030" stop-opacity="0" />
      <stop offset="1" stop-color="#303030" stop-opacity=".8" />
    </linearGradient>
    <filter id="ProgressBar-shadow" x="0" y="0" width="300" height="300" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity=".16" />
    </filter>
  </defs>
  <g id="ProgressBar-illustration">
    <rect x="32" y="94" width="236" height="112" rx="18" fill="url(#ProgressBar-surface)" stroke="#a1a1a1" stroke-width="1.5" filter="url(#ProgressBar-shadow)" />
    <rect x="54" y="115" width="74" height="7" rx="3.5" fill="#505050" />
    <rect x="213" y="115" width="32" height="7" rx="3.5" fill="#858585" />
    <rect x="54" y="147" width="192" height="16" rx="8" fill="#dedede" />
    <rect x="54" y="147" width="126" height="16" rx="8" fill="url(#ProgressBar-ink)" />
  </g>
</svg>
