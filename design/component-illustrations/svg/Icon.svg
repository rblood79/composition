<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="Icon-title Icon-desc">
  <title id="Icon-title">Icon</title>
  <desc id="Icon-desc">투명 배경의 편집 가능한 무채색 Icon 컴포넌트 일러스트</desc>
  <defs>
    <linearGradient id="Icon-surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4f4f4" />
      <stop offset="1" stop-color="#dedede" />
    </linearGradient>
    <linearGradient id="Icon-ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#777777" />
      <stop offset="1" stop-color="#4c4c4c" />
    </linearGradient>
    <linearGradient id="Icon-wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e1e1e1" />
      <stop offset="1" stop-color="#b5b5b5" />
    </linearGradient>
    <linearGradient id="Icon-area" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#eeeeee" />
      <stop offset="1" stop-color="#555555" />
    </linearGradient>
    <linearGradient id="Icon-shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#303030" stop-opacity="0" />
      <stop offset="1" stop-color="#303030" stop-opacity=".8" />
    </linearGradient>
    <filter id="Icon-shadow" x="0" y="0" width="300" height="300" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity=".16" />
    </filter>
  </defs>
  <g id="Icon-illustration">
    <rect x="75" y="75" width="150" height="150" rx="32" fill="url(#Icon-surface)" stroke="#a1a1a1" stroke-width="1.5" filter="url(#Icon-shadow)" />
    <path d="M150 104L164 132L195 137L172 159L178 190L150 175L122 190L128 159L105 137L136 132Z" fill="url(#Icon-wash)" stroke="#505050" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
