<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="PreviewTrigger-title PreviewTrigger-desc">
  <title id="PreviewTrigger-title">PreviewTrigger</title>
  <desc id="PreviewTrigger-desc">투명 배경의 편집 가능한 무채색 PreviewTrigger 컴포넌트 일러스트</desc>
  <defs>
    <linearGradient id="PreviewTrigger-surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4f4f4" />
      <stop offset="1" stop-color="#dedede" />
    </linearGradient>
    <linearGradient id="PreviewTrigger-ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#777777" />
      <stop offset="1" stop-color="#4c4c4c" />
    </linearGradient>
    <linearGradient id="PreviewTrigger-wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e1e1e1" />
      <stop offset="1" stop-color="#b5b5b5" />
    </linearGradient>
    <linearGradient id="PreviewTrigger-area" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#eeeeee" />
      <stop offset="1" stop-color="#555555" />
    </linearGradient>
    <linearGradient id="PreviewTrigger-shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#303030" stop-opacity="0" />
      <stop offset="1" stop-color="#303030" stop-opacity=".8" />
    </linearGradient>
    <filter id="PreviewTrigger-shadow" x="0" y="0" width="300" height="300" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity=".16" />
    </filter>
  </defs>
  <g id="PreviewTrigger-illustration">
    <rect x="45" y="40" width="210" height="142" rx="15" fill="url(#PreviewTrigger-surface)" stroke="#a1a1a1" stroke-width="1.5" filter="url(#PreviewTrigger-shadow)" />
    <path d="M139 181L150 193L161 181" fill="#dedede" stroke="#b9b9b9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="59" y="53" width="182" height="77" rx="10" fill="url(#PreviewTrigger-wash)" stroke="#b9b9b9" stroke-width="1" />
    <circle cx="191.85999999999999" cy="73.79" r="8.47" fill="#eeeeee" />
    <path d="M77.2 116.91L126.34 83.8L160.92000000000002 102.28L184.57999999999998 90.72999999999999L224.62 116.91Z" fill="#858585" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="60" y="145" width="105" height="8" rx="4.0" fill="#505050" />
    <rect x="60" y="163" width="145" height="5" rx="2.5" fill="#858585" />
    <rect x="99" y="212" width="102" height="36" rx="10" fill="url(#PreviewTrigger-surface)" stroke="#b9b9b9" stroke-width="1.5" />
    <path d="M128 230Q150 211 172 230Q150 249 128 230Z" fill="none" stroke="#858585" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="150" cy="230" r="5" fill="#505050" />
  </g>
