<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="chart-bar-title chart-bar-desc">
  <title id="chart-bar-title">chart-bar</title>
  <desc id="chart-bar-desc">투명 배경의 편집 가능한 무채색 chart-bar 컴포넌트 일러스트</desc>
  <defs>
    <linearGradient id="chart-bar-surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4f4f4" />
      <stop offset="1" stop-color="#dedede" />
    </linearGradient>
    <linearGradient id="chart-bar-ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#777777" />
      <stop offset="1" stop-color="#4c4c4c" />
    </linearGradient>
    <linearGradient id="chart-bar-wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e1e1e1" />
      <stop offset="1" stop-color="#b5b5b5" />
    </linearGradient>
    <linearGradient id="chart-bar-area" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#eeeeee" />
      <stop offset="1" stop-color="#555555" />
    </linearGradient>
    <linearGradient id="chart-bar-shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#303030" stop-opacity="0" />
      <stop offset="1" stop-color="#303030" stop-opacity=".8" />
    </linearGradient>
    <filter id="chart-bar-shadow" x="0" y="0" width="300" height="300" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity=".16" />
    </filter>
  </defs>
  <g id="chart-bar-illustration">
    <rect x="32" y="48" width="236" height="204" rx="18" fill="url(#chart-bar-surface)" stroke="#a1a1a1" stroke-width="1.5" filter="url(#chart-bar-shadow)" />
    <rect x="53" y="67" width="64" height="7" rx="3.5" fill="#505050" />
    <circle cx="232" cy="71" r="3" fill="#b9b9b9" />
    <path d="M56 107H245" fill="none" stroke="#dedede" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M56 143H245" fill="none" stroke="#dedede" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M56 179H245" fill="none" stroke="#dedede" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M56 215H245" fill="none" stroke="#dedede" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M56 98V215H245" fill="none" stroke="#b9b9b9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="69" y="167" width="15" height="48" rx="4" fill="url(#chart-bar-ink)" />
    <rect x="86" y="183.8" width="10" height="31.200000000000003" rx="3" fill="#b9b9b9" />
    <rect x="112" y="135" width="15" height="80" rx="4" fill="url(#chart-bar-ink)" />
    <rect x="129" y="163.0" width="10" height="52.0" rx="3" fill="#b9b9b9" />
    <rect x="155" y="153" width="15" height="62" rx="4" fill="url(#chart-bar-ink)" />
    <rect x="172" y="174.7" width="10" height="40.300000000000004" rx="3" fill="#b9b9b9" />
    <rect x="198" y="109" width="15" height="106" rx="4" fill="url(#chart-bar-ink)" />
    <rect x="215" y="146.1" width="10" height="68.9" rx="3" fill="#b9b9b9" />
  </g>
</svg>
