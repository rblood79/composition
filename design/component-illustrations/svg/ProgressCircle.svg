<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="ProgressCircle-title ProgressCircle-desc">
  <title id="ProgressCircle-title">ProgressCircle</title>
  <desc id="ProgressCircle-desc">투명 배경의 편집 가능한 무채색 ProgressCircle 컴포넌트 일러스트</desc>
  <defs>
    <linearGradient id="ProgressCircle-surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4f4f4" />
      <stop offset="1" stop-color="#dedede" />
    </linearGradient>
    <linearGradient id="ProgressCircle-ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#777777" />
      <stop offset="1" stop-color="#4c4c4c" />
    </linearGradient>
    <linearGradient id="ProgressCircle-wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e1e1e1" />
      <stop offset="1" stop-color="#b5b5b5" />
    </linearGradient>
    <linearGradient id="ProgressCircle-area" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#eeeeee" />
      <stop offset="1" stop-color="#555555" />
    </linearGradient>
    <linearGradient id="ProgressCircle-shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#303030" stop-opacity="0" />
      <stop offset="1" stop-color="#303030" stop-opacity=".8" />
    </linearGradient>
    <filter id="ProgressCircle-shadow" x="0" y="0" width="300" height="300" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity=".16" />
    </filter>
  </defs>
  <g id="ProgressCircle-illustration">
    <circle cx="150" cy="150" r="76" fill="#ececec" stroke="#b9b9b9" stroke-width="1.5" filter="url(#ProgressCircle-shadow)" />
    <circle cx="150" cy="150" r="52" fill="none" stroke="#dedede" stroke-width="12" />
    <circle cx="150" cy="150" r="52" fill="none" stroke="#505050" stroke-width="12" stroke-dasharray="229 327" stroke-linecap="round" transform="rotate(-90 150 150)" />
    <rect x="129" y="146" width="42" height="8" rx="4.0" fill="#858585" />
  </g>
</svg>
