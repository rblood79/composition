<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="Tabs-title Tabs-desc">
  <title id="Tabs-title">Tabs</title>
  <desc id="Tabs-desc">투명 배경의 편집 가능한 무채색 Tabs 컴포넌트 일러스트</desc>
  <defs>
    <linearGradient id="Tabs-surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4f4f4" />
      <stop offset="1" stop-color="#dedede" />
    </linearGradient>
    <linearGradient id="Tabs-ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#777777" />
      <stop offset="1" stop-color="#4c4c4c" />
    </linearGradient>
    <linearGradient id="Tabs-wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e1e1e1" />
      <stop offset="1" stop-color="#b5b5b5" />
    </linearGradient>
    <linearGradient id="Tabs-area" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#eeeeee" />
      <stop offset="1" stop-color="#555555" />
    </linearGradient>
    <linearGradient id="Tabs-shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#303030" stop-opacity="0" />
      <stop offset="1" stop-color="#303030" stop-opacity=".8" />
    </linearGradient>
    <filter id="Tabs-shadow" x="0" y="0" width="300" height="300" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity=".16" />
    </filter>
  </defs>
  <g id="Tabs-illustration">
    <rect x="34" y="70" width="232" height="160" rx="18" fill="url(#Tabs-surface)" stroke="#a1a1a1" stroke-width="1.5" filter="url(#Tabs-shadow)" />
    <rect x="55" y="89" width="45" height="7" rx="3.5" fill="#505050" />
    <rect x="123" y="89" width="44" height="7" rx="3.5" fill="#b9b9b9" />
    <rect x="191" y="89" width="44" height="7" rx="3.5" fill="#b9b9b9" />
    <path d="M35 111H265" fill="none" stroke="#dedede" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="53" y="108" width="50" height="4" rx="2.0" fill="#505050" />
    <rect x="56" y="139" width="126" height="10" rx="5.0" fill="#858585" />
    <rect x="56" y="164" width="182" height="7" rx="3.5" fill="#b9b9b9" />
    <rect x="56" y="185" width="146" height="7" rx="3.5" fill="#b9b9b9" />
  </g>
</svg>
