<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="Pagination-title Pagination-desc">
  <title id="Pagination-title">Pagination</title>
  <desc id="Pagination-desc">투명 배경의 편집 가능한 무채색 Pagination 컴포넌트 일러스트</desc>
  <defs>
    <linearGradient id="Pagination-surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4f4f4" />
      <stop offset="1" stop-color="#dedede" />
    </linearGradient>
    <linearGradient id="Pagination-ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#777777" />
      <stop offset="1" stop-color="#4c4c4c" />
    </linearGradient>
    <linearGradient id="Pagination-wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e1e1e1" />
      <stop offset="1" stop-color="#b5b5b5" />
    </linearGradient>
    <linearGradient id="Pagination-area" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#eeeeee" />
      <stop offset="1" stop-color="#555555" />
    </linearGradient>
    <linearGradient id="Pagination-shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#303030" stop-opacity="0" />
      <stop offset="1" stop-color="#303030" stop-opacity=".8" />
    </linearGradient>
    <filter id="Pagination-shadow" x="0" y="0" width="300" height="300" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity=".16" />
    </filter>
  </defs>
  <g id="Pagination-illustration">
    <rect x="27" y="111" width="246" height="78" rx="18" fill="url(#Pagination-surface)" stroke="#a1a1a1" stroke-width="1.5" filter="url(#Pagination-shadow)" />
    <rect x="42" y="130" width="36" height="38" rx="10" fill="url(#Pagination-surface)" stroke="#b9b9b9" stroke-width="1.5" />
    <g transform="translate(60 149) rotate(90) scale(1)">
      <path d="M-5 -2L0 3L5 -2" fill="none" stroke="#505050" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <rect x="87" y="130" width="36" height="38" rx="10" fill="url(#Pagination-ink)" stroke="#505050" stroke-width="1.5" />
    <rect x="101" y="144" width="8" height="10" rx="5.0" fill="#eeeeee" />
    <rect x="132" y="130" width="36" height="38" rx="10" fill="url(#Pagination-surface)" stroke="#b9b9b9" stroke-width="1.5" />
    <rect x="146" y="144" width="8" height="10" rx="5.0" fill="#858585" />
    <rect x="177" y="130" width="36" height="38" rx="10" fill="url(#Pagination-surface)" stroke="#b9b9b9" stroke-width="1.5" />
    <rect x="191" y="144" width="8" height="10" rx="5.0" fill="#858585" />
    <rect x="222" y="130" width="36" height="38" rx="10" fill="url(#Pagination-surface)" stroke="#b9b9b9" stroke-width="1.5" />
    <g transform="translate(240 149) rotate(-90) scale(1)">
      <path d="M-5 -2L0 3L5 -2" fill="none" stroke="#505050" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>
