<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="StatusLight-title StatusLight-desc">
  <title id="StatusLight-title">StatusLight</title>
  <desc id="StatusLight-desc">투명 배경의 편집 가능한 무채색 StatusLight 컴포넌트 일러스트</desc>
  <defs>
    <linearGradient id="StatusLight-surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4f4f4" />
      <stop offset="1" stop-color="#dedede" />
    </linearGradient>
    <linearGradient id="StatusLight-ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#777777" />
      <stop offset="1" stop-color="#4c4c4c" />
    </linearGradient>
    <linearGradient id="StatusLight-wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e1e1e1" />
      <stop offset="1" stop-color="#b5b5b5" />
    </linearGradient>
    <linearGradient id="StatusLight-area" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#eeeeee" />
      <stop offset="1" stop-color="#555555" />
    </linearGradient>
    <linearGradient id="StatusLight-shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#303030" stop-opacity="0" />
      <stop offset="1" stop-color="#303030" stop-opacity=".8" />
    </linearGradient>
    <filter id="StatusLight-shadow" x="0" y="0" width="300" height="300" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity=".16" />
    </filter>
  </defs>
  <g id="StatusLight-illustration">
    <rect x="45" y="111" width="210" height="78" rx="24" fill="url(#StatusLight-surface)" stroke="#a1a1a1" stroke-width="1.5" filter="url(#StatusLight-shadow)" />
    <circle cx="80" cy="150" r="10" fill="#505050" />
    <circle cx="80" cy="150" r="17" fill="none" stroke="#dedede" stroke-width="4" />
    <rect x="108" y="145" width="117" height="10" rx="5.0" fill="#505050" />
  </g>
</svg>
