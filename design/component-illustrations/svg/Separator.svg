<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="Separator-title Separator-desc">
  <title id="Separator-title">Separator</title>
  <desc id="Separator-desc">투명 배경의 편집 가능한 무채색 Separator 컴포넌트 일러스트</desc>
  <defs>
    <linearGradient id="Separator-surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4f4f4" />
      <stop offset="1" stop-color="#dedede" />
    </linearGradient>
    <linearGradient id="Separator-ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#777777" />
      <stop offset="1" stop-color="#4c4c4c" />
    </linearGradient>
    <linearGradient id="Separator-wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e1e1e1" />
      <stop offset="1" stop-color="#b5b5b5" />
    </linearGradient>
    <linearGradient id="Separator-area" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#eeeeee" />
      <stop offset="1" stop-color="#555555" />
    </linearGradient>
    <linearGradient id="Separator-shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#303030" stop-opacity="0" />
      <stop offset="1" stop-color="#303030" stop-opacity=".8" />
    </linearGradient>
    <filter id="Separator-shadow" x="0" y="0" width="300" height="300" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity=".16" />
    </filter>
  </defs>
  <g id="Separator-illustration">
    <rect x="38" y="79" width="224" height="142" rx="18" fill="url(#Separator-surface)" stroke="#a1a1a1" stroke-width="1.5" filter="url(#Separator-shadow)" />
    <rect x="61" y="102" width="92" height="7" rx="3.5" fill="#b9b9b9" />
    <rect x="61" y="120" width="144" height="6" rx="3.0" fill="#dedede" />
    <path d="M59 151H241" fill="none" stroke="#505050" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="61" y="176" width="124" height="7" rx="3.5" fill="#b9b9b9" />
    <rect x="61" y="194" width="93" height="6" rx="3.0" fill="#dedede" />
  </g>
</svg>
