<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="ToggleButton-title ToggleButton-desc">
  <title id="ToggleButton-title">ToggleButton</title>
  <desc id="ToggleButton-desc">투명 배경의 편집 가능한 무채색 ToggleButton 컴포넌트 일러스트</desc>
  <defs>
    <linearGradient id="ToggleButton-surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4f4f4" />
      <stop offset="1" stop-color="#dedede" />
    </linearGradient>
    <linearGradient id="ToggleButton-ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#777777" />
      <stop offset="1" stop-color="#4c4c4c" />
    </linearGradient>
    <linearGradient id="ToggleButton-wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e1e1e1" />
      <stop offset="1" stop-color="#b5b5b5" />
    </linearGradient>
    <linearGradient id="ToggleButton-area" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#eeeeee" />
      <stop offset="1" stop-color="#555555" />
    </linearGradient>
    <linearGradient id="ToggleButton-shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#303030" stop-opacity="0" />
      <stop offset="1" stop-color="#303030" stop-opacity=".8" />
    </linearGradient>
    <filter id="ToggleButton-shadow" x="0" y="0" width="300" height="300" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity=".16" />
    </filter>
  </defs>
  <g id="ToggleButton-illustration">
    <rect x="74" y="113" width="152" height="74" rx="18" fill="url(#ToggleButton-surface)" stroke="#a1a1a1" stroke-width="1.5" filter="url(#ToggleButton-shadow)" />
    <rect x="78" y="117" width="144" height="66" rx="15" fill="url(#ToggleButton-ink)" />
    <g transform="translate(103 150) scale(1)">
      <path d="M-7 0L-2 5L8 -6" fill="none" stroke="#eeeeee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <rect x="125" y="145" width="75" height="10" rx="5.0" fill="#eeeeee" />
  </g>
</svg>
