<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="ButtonGroup-title ButtonGroup-desc">
  <title id="ButtonGroup-title">ButtonGroup</title>
  <desc id="ButtonGroup-desc">투명 배경의 편집 가능한 무채색 ButtonGroup 컴포넌트 일러스트</desc>
  <defs>
    <linearGradient id="ButtonGroup-surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4f4f4" />
      <stop offset="1" stop-color="#dedede" />
    </linearGradient>
    <linearGradient id="ButtonGroup-ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#777777" />
      <stop offset="1" stop-color="#4c4c4c" />
    </linearGradient>
    <linearGradient id="ButtonGroup-wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e1e1e1" />
      <stop offset="1" stop-color="#b5b5b5" />
    </linearGradient>
    <linearGradient id="ButtonGroup-area" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#eeeeee" />
      <stop offset="1" stop-color="#555555" />
    </linearGradient>
    <linearGradient id="ButtonGroup-shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#303030" stop-opacity="0" />
      <stop offset="1" stop-color="#303030" stop-opacity=".8" />
    </linearGradient>
    <filter id="ButtonGroup-shadow" x="0" y="0" width="300" height="300" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity=".16" />
    </filter>
  </defs>
  <g id="ButtonGroup-illustration">
    <rect x="28" y="109" width="244" height="82" rx="20" fill="url(#ButtonGroup-surface)" stroke="#a1a1a1" stroke-width="1.5" filter="url(#ButtonGroup-shadow)" />
    <rect x="42" y="128" width="100" height="44" rx="10" fill="url(#ButtonGroup-surface)" stroke="#b9b9b9" stroke-width="1.5" />
    <rect x="67.0" y="147.0" width="50.0" height="6" rx="3.0" fill="#505050" />
    <rect x="154" y="128" width="104" height="44" rx="10" fill="url(#ButtonGroup-ink)" stroke="#505050" stroke-width="1.5" />
    <rect x="180.0" y="147.0" width="52.0" height="6" rx="3.0" fill="#e9e9e9" />
  </g>
</svg>
