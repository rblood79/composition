<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="Breadcrumbs-title Breadcrumbs-desc">
  <title id="Breadcrumbs-title">Breadcrumbs</title>
  <desc id="Breadcrumbs-desc">투명 배경의 편집 가능한 무채색 Breadcrumbs 컴포넌트 일러스트</desc>
  <defs>
    <linearGradient id="Breadcrumbs-surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4f4f4" />
      <stop offset="1" stop-color="#dedede" />
    </linearGradient>
    <linearGradient id="Breadcrumbs-ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#777777" />
      <stop offset="1" stop-color="#4c4c4c" />
    </linearGradient>
    <linearGradient id="Breadcrumbs-wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e1e1e1" />
      <stop offset="1" stop-color="#b5b5b5" />
    </linearGradient>
    <linearGradient id="Breadcrumbs-area" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#eeeeee" />
      <stop offset="1" stop-color="#555555" />
    </linearGradient>
    <linearGradient id="Breadcrumbs-shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#303030" stop-opacity="0" />
      <stop offset="1" stop-color="#303030" stop-opacity=".8" />
    </linearGradient>
    <filter id="Breadcrumbs-shadow" x="0" y="0" width="300" height="300" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity=".16" />
    </filter>
  </defs>
  <g id="Breadcrumbs-illustration">
    <rect x="28" y="113" width="244" height="74" rx="18" fill="url(#Breadcrumbs-surface)" stroke="#a1a1a1" stroke-width="1.5" filter="url(#Breadcrumbs-shadow)" />
    <rect x="47" y="146" width="42" height="8" rx="4.0" fill="#b9b9b9" />
    <g transform="translate(105 150) rotate(-90) scale(0.8)">
      <path d="M-5 -2L0 3L5 -2" fill="none" stroke="#858585" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <rect x="122" y="146" width="46" height="8" rx="4.0" fill="#858585" />
    <g transform="translate(186 150) rotate(-90) scale(0.8)">
      <path d="M-5 -2L0 3L5 -2" fill="none" stroke="#858585" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <rect x="202" y="146" width="51" height="8" rx="4.0" fill="#505050" />
  </g>
</svg>
