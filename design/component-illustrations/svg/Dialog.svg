<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="Dialog-title Dialog-desc">
  <title id="Dialog-title">Dialog</title>
  <desc id="Dialog-desc">투명 배경의 편집 가능한 무채색 Dialog 컴포넌트 일러스트</desc>
  <defs>
    <linearGradient id="Dialog-surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4f4f4" />
      <stop offset="1" stop-color="#dedede" />
    </linearGradient>
    <linearGradient id="Dialog-ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#777777" />
      <stop offset="1" stop-color="#4c4c4c" />
    </linearGradient>
    <linearGradient id="Dialog-wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e1e1e1" />
      <stop offset="1" stop-color="#b5b5b5" />
    </linearGradient>
    <linearGradient id="Dialog-area" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#eeeeee" />
      <stop offset="1" stop-color="#555555" />
    </linearGradient>
    <linearGradient id="Dialog-shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#303030" stop-opacity="0" />
      <stop offset="1" stop-color="#303030" stop-opacity=".8" />
    </linearGradient>
    <filter id="Dialog-shadow" x="0" y="0" width="300" height="300" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity=".16" />
    </filter>
  </defs>
  <g id="Dialog-illustration">
    <rect x="29" y="35" width="242" height="230" rx="20" fill="url(#Dialog-surface)" stroke="#a1a1a1" stroke-width="1.5" filter="url(#Dialog-shadow)" />
    <rect x="40" y="46" width="220" height="208" rx="13" fill="#c6c6c6" />
    <rect x="51" y="73" width="198" height="162" rx="15" fill="url(#Dialog-surface)" stroke="#a1a1a1" stroke-width="1.5" filter="url(#Dialog-shadow)" />
    <rect x="68" y="98" width="108" height="10" rx="5.0" fill="#505050" />
    <g transform="translate(229 101) scale(1)">
      <path d="M-4 -4L4 4M-4 4L4 -4" fill="none" stroke="#858585" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <rect x="68" y="125" width="160" height="6" rx="3.0" fill="#858585" />
    <rect x="68" y="136" width="123" height="6" rx="3.0" fill="#b9b9b9" />
    <rect x="164" y="197" width="66" height="28" rx="10" fill="url(#Dialog-ink)" stroke="#505050" stroke-width="1.5" />
    <rect x="180.5" y="208.0" width="33.0" height="6" rx="3.0" fill="#e9e9e9" />
    <rect x="90" y="197" width="65" height="28" rx="10" fill="url(#Dialog-surface)" stroke="#b9b9b9" stroke-width="1.5" />
    <rect x="106.25" y="208.0" width="32.5" height="6" rx="3.0" fill="#505050" />
  </g>
</svg>
