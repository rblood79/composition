<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="frame-title frame-desc">
  <title id="frame-title">frame</title>
  <desc id="frame-desc">투명 배경의 편집 가능한 무채색 frame 컴포넌트 일러스트</desc>
  <defs>
    <linearGradient id="frame-surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4f4f4" />
      <stop offset="1" stop-color="#dedede" />
    </linearGradient>
    <linearGradient id="frame-ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#777777" />
      <stop offset="1" stop-color="#4c4c4c" />
    </linearGradient>
    <linearGradient id="frame-wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e1e1e1" />
      <stop offset="1" stop-color="#b5b5b5" />
    </linearGradient>
    <linearGradient id="frame-area" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#eeeeee" />
      <stop offset="1" stop-color="#555555" />
    </linearGradient>
    <linearGradient id="frame-shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#303030" stop-opacity="0" />
      <stop offset="1" stop-color="#303030" stop-opacity=".8" />
    </linearGradient>
    <filter id="frame-shadow" x="0" y="0" width="300" height="300" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity=".16" />
    </filter>
  </defs>
  <g id="frame-illustration">
    <rect x="47" y="57" width="206" height="186" rx="3" fill="url(#frame-surface)" stroke="#a1a1a1" stroke-width="1.5" filter="url(#frame-shadow)" />
    <rect x="65" y="78" width="170" height="145" rx="5" fill="none" stroke="#b9b9b9" stroke-width="1.5" stroke-dasharray="6 6" />
    <rect x="81" y="95" width="61" height="111" rx="8" fill="#dedede" />
    <rect x="154" y="95" width="65" height="48" rx="8" fill="#b9b9b9" />
    <rect x="154" y="155" width="65" height="51" rx="8" fill="#dedede" />
    <rect x="42" y="52" width="10" height="10" rx="2" fill="#eeeeee" stroke="#505050" stroke-width="2" />
    <rect x="42" y="238" width="10" height="10" rx="2" fill="#eeeeee" stroke="#505050" stroke-width="2" />
    <rect x="248" y="52" width="10" height="10" rx="2" fill="#eeeeee" stroke="#505050" stroke-width="2" />
    <rect x="248" y="238" width="10" height="10" rx="2" fill="#eeeeee" stroke="#505050" stroke-width="2" />
  </g>
</svg>
