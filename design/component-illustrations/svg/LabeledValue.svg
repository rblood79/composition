<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="LabeledValue-title LabeledValue-desc">
  <title id="LabeledValue-title">LabeledValue</title>
  <desc id="LabeledValue-desc">투명 배경의 편집 가능한 무채색 LabeledValue 컴포넌트 일러스트</desc>
  <defs>
    <linearGradient id="LabeledValue-surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4f4f4" />
      <stop offset="1" stop-color="#dedede" />
    </linearGradient>
    <linearGradient id="LabeledValue-ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#777777" />
      <stop offset="1" stop-color="#4c4c4c" />
    </linearGradient>
    <linearGradient id="LabeledValue-wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e1e1e1" />
      <stop offset="1" stop-color="#b5b5b5" />
    </linearGradient>
    <linearGradient id="LabeledValue-area" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#eeeeee" />
      <stop offset="1" stop-color="#555555" />
    </linearGradient>
    <linearGradient id="LabeledValue-shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#303030" stop-opacity="0" />
      <stop offset="1" stop-color="#303030" stop-opacity=".8" />
    </linearGradient>
    <filter id="LabeledValue-shadow" x="0" y="0" width="300" height="300" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity=".16" />
    </filter>
  </defs>
  <g id="LabeledValue-illustration">
    <rect x="47" y="91" width="206" height="118" rx="18" fill="url(#LabeledValue-surface)" stroke="#a1a1a1" stroke-width="1.5" filter="url(#LabeledValue-shadow)" />
    <rect x="69" y="114" width="64" height="8" rx="4.0" fill="#858585" />
    <rect x="69" y="143" width="151" height="15" rx="7.5" fill="#505050" />
    <rect x="69" y="177" width="103" height="5" rx="2.5" fill="#b9b9b9" />
  </g>
</svg>
