<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="LinkButton-title LinkButton-desc">
  <title id="LinkButton-title">LinkButton</title>
  <desc id="LinkButton-desc">투명 배경의 편집 가능한 무채색 LinkButton 컴포넌트 일러스트</desc>
  <defs>
    <linearGradient id="LinkButton-surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4f4f4" />
      <stop offset="1" stop-color="#dedede" />
    </linearGradient>
    <linearGradient id="LinkButton-ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#777777" />
      <stop offset="1" stop-color="#4c4c4c" />
    </linearGradient>
    <linearGradient id="LinkButton-wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e1e1e1" />
      <stop offset="1" stop-color="#b5b5b5" />
    </linearGradient>
    <linearGradient id="LinkButton-area" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#eeeeee" />
      <stop offset="1" stop-color="#555555" />
    </linearGradient>
    <linearGradient id="LinkButton-shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#303030" stop-opacity="0" />
      <stop offset="1" stop-color="#303030" stop-opacity=".8" />
    </linearGradient>
    <filter id="LinkButton-shadow" x="0" y="0" width="300" height="300" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity=".16" />
    </filter>
  </defs>
  <g id="LinkButton-illustration">
    <rect x="57" y="112" width="186" height="76" rx="23" fill="url(#LinkButton-surface)" stroke="#a1a1a1" stroke-width="1.5" filter="url(#LinkButton-shadow)" />
    <rect x="61" y="116" width="178" height="68" rx="10" fill="url(#LinkButton-surface)" stroke="#b9b9b9" stroke-width="1.5" />
    <rect x="91" y="145" width="80" height="10" rx="5.0" fill="#505050" />
    <path d="M194 155L209 140M198 140H209V151" fill="none" stroke="#505050" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
