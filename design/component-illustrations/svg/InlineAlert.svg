<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="InlineAlert-title InlineAlert-desc">
  <title id="InlineAlert-title">InlineAlert</title>
  <desc id="InlineAlert-desc">투명 배경의 편집 가능한 무채색 InlineAlert 컴포넌트 일러스트</desc>
  <defs>
    <linearGradient id="InlineAlert-surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4f4f4" />
      <stop offset="1" stop-color="#dedede" />
    </linearGradient>
    <linearGradient id="InlineAlert-ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#777777" />
      <stop offset="1" stop-color="#4c4c4c" />
    </linearGradient>
    <linearGradient id="InlineAlert-wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e1e1e1" />
      <stop offset="1" stop-color="#b5b5b5" />
    </linearGradient>
    <linearGradient id="InlineAlert-area" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#eeeeee" />
      <stop offset="1" stop-color="#555555" />
    </linearGradient>
    <linearGradient id="InlineAlert-shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#303030" stop-opacity="0" />
      <stop offset="1" stop-color="#303030" stop-opacity=".8" />
    </linearGradient>
    <filter id="InlineAlert-shadow" x="0" y="0" width="300" height="300" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity=".16" />
    </filter>
  </defs>
  <g id="InlineAlert-illustration">
    <rect x="31" y="90" width="238" height="120" rx="18" fill="url(#InlineAlert-surface)" stroke="#a1a1a1" stroke-width="1.5" filter="url(#InlineAlert-shadow)" />
    <circle cx="62" cy="120" r="13" fill="#505050" />
    <path d="M62 113L62 121" fill="none" stroke="#ededed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="62" cy="127" r="1.7" fill="#ededed" />
    <rect x="88" y="114" width="112" height="10" rx="5.0" fill="#505050" />
    <rect x="88" y="141" width="151" height="6" rx="3.0" fill="#858585" />
    <rect x="88" y="158" width="126" height="6" rx="3.0" fill="#858585" />
    <rect x="88" y="182" width="65" height="6" rx="3.0" fill="#505050" />
  </g>
</svg>
