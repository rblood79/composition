<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="Skeleton-title Skeleton-desc">
  <title id="Skeleton-title">Skeleton</title>
  <desc id="Skeleton-desc">투명 배경의 편집 가능한 무채색 Skeleton 컴포넌트 일러스트</desc>
  <defs>
    <linearGradient id="Skeleton-surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4f4f4" />
      <stop offset="1" stop-color="#dedede" />
    </linearGradient>
    <linearGradient id="Skeleton-ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#777777" />
      <stop offset="1" stop-color="#4c4c4c" />
    </linearGradient>
    <linearGradient id="Skeleton-wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e1e1e1" />
      <stop offset="1" stop-color="#b5b5b5" />
    </linearGradient>
    <linearGradient id="Skeleton-area" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#eeeeee" />
      <stop offset="1" stop-color="#555555" />
    </linearGradient>
    <linearGradient id="Skeleton-shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#303030" stop-opacity="0" />
      <stop offset="1" stop-color="#303030" stop-opacity=".8" />
    </linearGradient>
    <filter id="Skeleton-shadow" x="0" y="0" width="300" height="300" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity=".16" />
    </filter>
  </defs>
  <g id="Skeleton-illustration">
    <rect x="38" y="60" width="224" height="180" rx="18" fill="url(#Skeleton-surface)" stroke="#a1a1a1" stroke-width="1.5" filter="url(#Skeleton-shadow)" />
    <circle cx="78" cy="101" r="21" fill="url(#Skeleton-wash)" />
    <rect x="112" y="86" width="122" height="10" rx="5.0" fill="#dedede" />
    <rect x="112" y="108" width="83" height="8" rx="4.0" fill="#dedede" />
    <rect x="59" y="146" width="182" height="10" rx="5.0" fill="url(#Skeleton-wash)" />
    <rect x="59" y="169" width="156" height="10" rx="5.0" fill="url(#Skeleton-wash)" />
    <rect x="59" y="192" width="112" height="10" rx="5.0" fill="url(#Skeleton-wash)" />
  </g>
</svg>
