<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="AvatarGroup-title AvatarGroup-desc">
  <title id="AvatarGroup-title">AvatarGroup</title>
  <desc id="AvatarGroup-desc">투명 배경의 편집 가능한 무채색 AvatarGroup 컴포넌트 일러스트</desc>
  <defs>
