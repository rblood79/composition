<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="Slot-title Slot-desc">
  <title id="Slot-title">Slot</title>
  <desc id="Slot-desc">투명 배경의 편집 가능한 무채색 Slot 컴포넌트 일러스트</desc>
  <defs>
    <linearGradient id="Slot-surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4f4f4" />
      <stop offset="1" stop-color="#dedede" />
    </linearGradient>
    <linearGradient id="Slot-ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#777777" />
      <stop offset="1" stop-color="#4c4c4c" />
    </linearGradient>
    <linearGradient id="Slot-wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e1e1e1" />
      <stop offset="1" stop-color="#b5b5b5" />
    </linearGradient>
    <linearGradient id="Slot-area" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#eeeeee" />
      <stop offset="1" stop-color="#555555" />
    </linearGradient>
    <linearGradient id="Slot-shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#303030" stop-opacity="0" />
      <stop offset="1" stop-color="#303030" stop-opacity=".8" />
    </linearGradient>
    <filter id="Slot-shadow" x="0" y="0" width="300" height="300" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity=".16" />
    </filter>
  </defs>
  <g id="Slot-illustration">
    <rect x="49" y="55" width="202" height="190" rx="18" fill="url(#Slot-surface)" stroke="#a1a1a1" stroke-width="1.5" filter="url(#Slot-shadow)" />
    <rect x="65" y="71" width="170" height="158" rx="12" fill="none" stroke="#858585" stroke-width="2" stroke-dasharray="7 7" />
    <circle cx="150" cy="141" r="26" fill="#dedede" />
    <g transform="translate(150 141) scale(1.5)">
      <path d="M-6 0H6M0 -6V6" fill="none" stroke="#505050" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <rect x="115" y="190" width="70" height="7" rx="3.5" fill="#858585" />
  </g>
</svg>
