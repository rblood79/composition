<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="chart-radial-title chart-radial-desc">
  <title id="chart-radial-title">chart-radial</title>
  <desc id="chart-radial-desc">투명 배경의 편집 가능한 무채색 chart-radial 컴포넌트 일러스트</desc>
  <defs>
    <linearGradient id="chart-radial-surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4f4f4" />
      <stop offset="1" stop-color="#dedede" />
    </linearGradient>
    <linearGradient id="chart-radial-ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#777777" />
      <stop offset="1" stop-color="#4c4c4c" />
    </linearGradient>
    <linearGradient id="chart-radial-wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e1e1e1" />
      <stop offset="1" stop-color="#b5b5b5" />
    </linearGradient>
    <linearGradient id="chart-radial-area" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#eeeeee" />
      <stop offset="1" stop-color="#555555" />
    </linearGradient>
    <linearGradient id="chart-radial-shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#303030" stop-opacity="0" />
      <stop offset="1" stop-color="#303030" stop-opacity=".8" />
    </linearGradient>
    <filter id="chart-radial-shadow" x="0" y="0" width="300" height="300" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity=".16" />
    </filter>
  </defs>
  <g id="chart-radial-illustration">
    <rect x="32" y="48" width="236" height="204" rx="18" fill="url(#chart-radial-surface)" stroke="#a1a1a1" stroke-width="1.5" filter="url(#chart-radial-shadow)" />
    <rect x="53" y="67" width="64" height="7" rx="3.5" fill="#505050" />
    <circle cx="232" cy="71" r="3" fill="#b9b9b9" />
    <circle cx="150" cy="162" r="65" fill="none" stroke="#dedede" stroke-width="12" />
    <circle cx="150" cy="162" r="65" fill="none" stroke="#505050" stroke-width="12" stroke-dasharray="282 408.4070449666731" stroke-linecap="round" transform="rotate(-90 150 162)" />
    <circle cx="150" cy="162" r="45" fill="none" stroke="#dedede" stroke-width="12" />
    <circle cx="150" cy="162" r="45" fill="none" stroke="#858585" stroke-width="12" stroke-dasharray="190 282.7433388230814" stroke-linecap="round" transform="rotate(-90 150 162)" />
    <circle cx="150" cy="162" r="25" fill="none" stroke="#dedede" stroke-width="12" />
    <circle cx="150" cy="162" r="25" fill="none" stroke="#b9b9b9" stroke-width="12" stroke-dasharray="110 157.07963267948966" stroke-linecap="round" transform="rotate(-90 150 162)" />
  </g>
</svg>
