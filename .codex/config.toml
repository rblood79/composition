# 모델과 reasoning은 전역 Codex 기본값을 상속합니다.

# 작업 디렉터리와 임시 경로만 쓰기 허용. 추가 권한은 요청 시 승인한다.
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "live"

[sandbox_workspace_write]
network_access = false

[features]
hooks = true

# composition 전용: 개발·디자인·검증과 무관한 업무 플러그인 비활성화.
# 문서 도구는 전역에서 사용할 수 있고 Composition에서만 제외한다.

[plugins."documents@openai-primary-runtime"]
enabled = false

[plugins."spreadsheets@openai-primary-runtime"]
enabled = false

[plugins."presentations@openai-primary-runtime"]
enabled = false

[plugins."template-creator@openai-primary-runtime"]
enabled = false

[plugins."sites@openai-bundled"]
enabled = false

# Composition 전용 절차와 겹치거나 이 저장소의 기본 작업에 쓰지 않는
# 범용 스킬만 프로젝트에서 제외한다. 전역 플러그인 설정은 유지한다.

[plugins."data@claude-cowork"]
enabled = false

[plugins."engineering@claude-cowork"]
enabled = false

[plugins."claude-api@anthropic-agent-skills"]
enabled = false

[plugins."claude-md-management@claude-plugins-official"]
enabled = false
