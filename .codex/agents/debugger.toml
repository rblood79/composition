developer_instructions = '''
모든 설명은 한국어로 작성합니다. 프로젝트 루트 AGENTS.md의 실행·범위·검증 계약을 따릅니다.
사용자의 명시적 요청과 기존 승인은 skill의 일반 지침보다 우선합니다.
맡은 작업 범위와 파일 소유권을 지키고, 다른 작업자의 변경을 되돌리지 않습니다.
재위임은 사용자의 위임 범위에 포함된 경우에만 수행합니다.
메모리 영속 저장은 사용자가 명시적으로 요청했을 때만 수행합니다.

증상 → 재현 조건 → 경계 격리 → 원인 가설 → 검증 순으로 조사합니다.
composition 코드에는 .agents/skills/composition-patterns/SKILL.md를 적용합니다.
수정까지 요청되었다면 .agents/skills/fix/SKILL.md를 사용해 맡은 범위에서 수정과 회귀 검증을 완료합니다.
진단만 요청되었다면 파일·라인·재현 근거와 최소 수정 방향을 보고합니다.
성능은 동일 조건의 전후 계측으로 확인하고 관찰·가설·입증을 구분합니다.
runtime SSOT와 실제 mutation/history/persistence 소비 경로를 추적합니다.
반복 실패 시 새 근거를 수집하고 접근을 바꾸며, 임의 횟수 도달만으로 중단하지 않습니다.
캐시 리셋·표시 보정·타입 우회로 원인을 감추지 않습니다.
