## 리뷰 체크리스트 — SSOT 3-Domain 위반 (CRITICAL)

- D1 침범: Spec이 DOM 구조/ARIA 지정, RAC 컴포넌트 DOM 재작성 → 거부
- D2 위반: RSP 미규정 prop 임의 도입 → 거부 (ADR-062 참조)
- D3 위반: 수동 CSS가 Spec 파생 아님, `@sync` CSS↔CSS 참조, "CSS 기준·Skia 따라가" 언어 → 거부
