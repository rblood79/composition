# ADR-201 참조 서버 설정 (docs/reference/upload/server-contract.md §6 knob 표)
# 모든 키는 JVM 시스템 프로퍼티 (-Dupload.storage.dir=...) 또는 환경 변수로 덮어쓸 수 있다 (Spring Environment 우선순위).
# 비밀 (DB 비밀번호 등) 은 이 파일에 쓰지 않는다 — JNDI DataSource 또는 시스템 프로퍼티로 주입.

# 파일 바이트 저장 디렉터리 — 반드시 웹루트 밖 (ServletContext.getRealPath("/") 하위면 기동 실패, S1)
upload.storage.dir=${java.io.tmpdir}/composition-uploads

# Tus-Max-Size — 파일 1개 상한 (바이트). 기본 10 GiB
upload.maxSize=10737418240
# PATCH 1회 상한 (바이트). 클라이언트 chunkSize 상한과 맞춘다. 기본 64 MiB
upload.chunk.maxBytes=67108864
# Upload-Expires = 마지막 PATCH + TTL
upload.ttlHours=24
# TTL GC 주기 (ms). 기본 10분
upload.gcIntervalMillis=600000
# 소유자당 동시 활성(CREATED/UPLOADING) 업로드 수 — 초과 429
upload.quota.maxActivePerOwner=10
# 확장자 화이트리스트 (소문자, 쉼표 구분). 확장자 없는 파일은 거부
upload.allowedExtensions=pdf,png,jpg,jpeg,gif,zip,txt,csv,json,xlsx,docx,pptx,hwp,hwpx,mp4

# CORS — 교차 출처 배포에서만. 비우면 CORS 헤더 0 (same-origin 권장). `*` 금지 (credentials 와 조합 불가)
upload.cors.allowedOrigins=

# 개발용 로그인 (GET /session/dev-login?owner=...) — 운영에서는 반드시 false
upload.devLogin.enabled=false

# 메타 DB — JNDI 이름이 있으면 우선 (Tomcat context.xml <Resource name="jdbc/upload" .../>)
upload.jdbc.jndiName=
# JNDI 가 없을 때의 직접 연결 (개발: H2 파일 DB, Oracle 호환 모드)
upload.jdbc.driver=org.h2.Driver
upload.jdbc.url=jdbc:h2:file:${java.io.tmpdir}/composition-upload-meta;MODE=Oracle;AUTO_SERVER=TRUE
upload.jdbc.username=sa
upload.jdbc.password=
# 기동 시 스키마 생성: h2 (schema-h2.sql 실행, CREATE TABLE IF NOT EXISTS) | none (Oracle — DBA 가 schema-oracle.sql 실행)
upload.jdbc.initSchema=h2
